<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conciertos Madrid</title>
<meta name="description" content="Agenda automática de conciertos en la Comunidad de Madrid: rock, metal, blues, americana, folk, punk, indie, synthwave y dark wave. Datos trazables a sus fuentes.">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Cpath d='M40 12v26a8 8 0 1 1-4-6.9V18l-12 3v21a8 8 0 1 1-4-6.9V16z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#efede8; --ink:#1b1c1f; --muted:#5d6066; --line:#dcd9d2;
  --accent:#c2410c; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --c-rock:#b91c1c; --c-pop:#7c3aed; --c-amer:#a16207; --c-blues:#1d4ed8; --c-punk:#be185d; --c-cant:#0f766e;
  --c-trib:#c2410c; --c-fuera:#6b7280; --c-sin:#334155; --c-synth:#4d7c0f;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --c-synth:#a3e635; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --c-synth:#a3e635; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--info)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* cabecera */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1.05rem;margin:0;flex:1;min-width:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 16px 8px;max-width:960px;margin:0 auto}
.seg button{border:0;background:var(--panel2);padding:7px 0;border-radius:10px;color:var(--muted);font-weight:700;font-size:.92rem}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.menu{position:absolute;right:16px;top:52px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:30;min-width:220px;padding:6px}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;text-decoration:none;color:var(--ink);border-radius:8px;text-align:left}
.menu a:hover,.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
main{max-width:960px;margin:0 auto;padding:10px 16px 48px}
/* filtros */
.bar{display:flex;gap:8px;align-items:center}
.sbox{position:relative;flex:1;min-width:0}
.search{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 36px 0 12px;background:var(--panel)}
input[type=search]::-webkit-search-cancel-button{display:none}
.sclear{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:1.1rem}
.fbtn{height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-weight:600}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--ink) 7%,var(--panel))}
.chip[aria-pressed="false"] i{opacity:.35}
.active{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.active button{border:0;background:none;color:var(--info);padding:0;font-size:.8rem;text-decoration:underline}
/* navegación de fechas */
.nav{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.nav .title{flex:1;font-weight:800;text-align:center;font-size:1.02rem}
.nav .title::first-letter,.dayhead::first-letter{text-transform:uppercase}
.hoy{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:40px;padding:0 12px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 6px}
.strip button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.strip .d{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.strip .n{font-size:1.05rem;font-weight:800}
.strip .c{font-size:.7rem;color:var(--muted)}
.strip button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button.sel .d,.strip button.sel .c{color:var(--bg);opacity:.8}
.strip button.hoyd{outline:2px solid var(--accent);outline-offset:-2px}
.strip button.past{opacity:.5}
.stickystrip{position:sticky;top:var(--hh,96px);z-index:3;background:var(--bg);padding:6px 0 2px}
/* mes */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0;font-weight:700}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:4px 5px;display:flex;flex-direction:column;text-align:left}
.day.out{visibility:hidden}
.day.past{opacity:.45}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;opacity:1}
.day .n{font-size:.75rem;color:var(--muted);font-weight:600}
.day .cnt{font-size:1.05rem;font-weight:800;margin-top:auto}
.day .cnt:empty{display:none}
.day .stack{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:3px;background:var(--panel2)}
.day.zero{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.76rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dayhead{margin:18px 0 6px;font-weight:800;display:flex;align-items:baseline;gap:8px;scroll-margin-top:170px}
.dayhead small{color:var(--muted);font-weight:500}
/* tarjeta */
.card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin:8px 0;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--c-sin))}
.thumb{flex:0 0 60px;width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:1.1rem;overflow:hidden}
.cbody{flex:1;min-width:0}
.art{font-weight:800;font-size:1.02rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--muted);font-size:.86rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center}
.tag{font-size:.74rem;border-radius:6px;padding:1px 6px;background:var(--panel2);color:var(--ink)}
.tag.ag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.flag{font-size:1rem;line-height:1}
.st{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.st-conf{color:var(--bad)} .st-canc{color:var(--warn)}
.chev{color:var(--muted);font-size:1.3rem}
/* ficha */
.back{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;text-decoration:none;font-weight:600}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:4/3;max-height:420px;width:100%}
.hero .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(22px) brightness(.8);transform:scale(1.1)}
.hero img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gc,var(--c-sin)),color-mix(in srgb,var(--gc,var(--c-sin)) 45%,#000))}
.credit{font-size:.72rem;color:var(--muted);margin-top:4px}
.dt h2{font-size:1.55rem;margin:12px 0 2px;line-height:1.15}
.dt .ciclo{color:var(--muted);font-size:.9rem}
.dt .inv{color:var(--muted);margin-top:2px}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.row{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{flex:0 0 24px;font-size:1.15rem;line-height:1.4;text-align:center}
.row .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.row .v{font-weight:650}
.row .s{font-size:.8rem;color:var(--muted);margin-top:1px}
.box{border-radius:12px;padding:10px 12px;margin:10px 0;border:1px solid}
.box-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.box-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.box-warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.box ul{margin:6px 0 0;padding-left:20px}
.vers{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.vers div{display:flex;gap:8px;align-items:baseline}
.vers b{font-variant-numeric:tabular-nums;min-width:52px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.actions .primary{grid-column:1/-1}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:600}
.lbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.links .lbtn{min-height:40px;font-weight:500}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--c-blues);outline-offset:2px;border-radius:6px}
h3.sec{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 4px}
details.more{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:600}
details.more ul{padding-left:20px;margin:8px 0}
/* panel de filtros */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;display:flex;flex-direction:column;background:var(--bg);z-index:21;border-radius:18px 18px 0 0;max-width:720px;margin:0 auto}
.sheet .sc{overflow:auto;padding:14px 16px 8px}
.sheet .ft{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .ft button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.sheet .ft .go{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:2}
.sheet h3{margin:0 0 4px}
.sheet h4{margin:16px 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 8px;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--ink) 7%,var(--panel))}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:6px 0}
.grp label{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.grp input{width:20px;height:20px;accent-color:var(--ink)}
.grp .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.grp .nm{flex:1;font-weight:600}
.grp .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.grp .ct{color:var(--muted);font-size:.85rem}
.grp details{padding:0 12px 10px}
.grp summary{cursor:pointer;color:var(--info);font-size:.82rem}
.grp .inc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.grp .inc span{font-size:.75rem;background:var(--panel2);border-radius:6px;padding:1px 6px}
.grp .inc span.has{outline:1px solid var(--ok)}
.grp .inc .est{font-size:.78rem;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 9px;color:var(--ink)}
.grp .inc .est:disabled{opacity:.45}
.grp .inc .est.has{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.grp .inc .est.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.hint{color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.viejo{color:var(--c-trib);font-weight:600}
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:10px;margin:10px 0}
.skel-bar{height:40px}.skel-card{height:72px}.skel-hero{height:200px}.skel-l{height:28px;width:70%}.skel-m{height:48px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:1.4rem}
.kpi span{color:var(--muted);font-size:.8rem}
.s-ok{color:var(--ok);font-weight:700} .s-err{color:var(--bad);font-weight:700} .s-warn{color:var(--warn);font-weight:700}
.genre{margin:14px 0}
.genre h3{margin:0 0 6px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.style{font-size:.84rem;border:1px solid var(--line);border-radius:8px;padding:3px 8px;text-decoration:none;color:var(--muted);background:var(--panel)}
.style.has{border-color:var(--ok);color:var(--ok);font-weight:700;background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.md h1,.md h2{font-size:1.1rem;margin:18px 0 6px} .md h3{font-size:1rem;margin:14px 0 4px}
.md ul{padding-left:20px} .md code{background:var(--panel2);padding:1px 4px;border-radius:4px}
.muted{color:var(--muted)}
@media (min-width:700px){.day{min-height:78px}.actions{grid-template-columns:repeat(3,1fr)}.actions .primary{grid-column:auto}}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>Conciertos Madrid<small id="upd">Cargando…</small></h1>
    <button class="iconbtn" id="menubtn" aria-haspopup="menu" aria-label="Más opciones">☰</button>
  </div>
  <nav class="seg" role="tablist" id="tabs"></nav>
</header>
<div id="menu"></div>
<main id="main" aria-busy="true"><div class="skel skel-bar"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div><span class="sr">Cargando datos…</span></main>
<div id="sheet"></div>
<script>
"use strict";
// ---------------------------------------------------------------- grupos (agrupaciones de estilos de Discogs)
const GRUPOS = [
  {id:"rock y metal", nombre:"Rock y metal", v:"--c-rock", desc:"Hard rock, heavy metal, AOR, prog, stoner, psicodelia, grunge, rock clásico y alternativo…"},
  {id:"punk y garage", nombre:"Punk y garage", v:"--c-punk", desc:"Punk, hardcore, garage, post-punk, rock & roll, rockabilly, surf…"},
  {id:"pop e indie", nombre:"Indie y pop-rock", v:"--c-pop", desc:"Indie rock, indie pop, pop rock, power pop, shoegaze, new wave… (el pop comercial y latino va a Otros géneros)"},
  {id:"americana/country/folk", nombre:"Americana y folk", v:"--c-amer", desc:"Country, country rock, folk, folk rock, southern rock, bluegrass…"},
  {id:"blues", nombre:"Blues", v:"--c-blues", desc:"Todos los estilos de blues y el blues rock."},
  {id:"synth y dark wave", nombre:"Synthwave y dark wave", v:"--c-synth", desc:"Synthwave y neo synthwave (retrowave, outrun, darksynth…), darkwave, coldwave, synth-pop, EBM, italo-disco… (el resto de la electrónica va a Otros géneros)"},
  {id:"cantautor", nombre:"Cantautores", v:"--c-cant", desc:"Solo por la etiqueta de la agenda (Discogs no tiene este estilo)."},
  {id:"tributos y versiones", nombre:"Tributos", v:"--c-trib", desc:"Bandas tributo y de versiones (por la agenda o el título)."},
  {id:"sin clasificar", nombre:"Sin clasificar", v:"--c-sin", desc:"Ni las webs de música ni la agenda dan estilo. Se muestran para no perder conciertos."},
  {id:"fuera de foco", nombre:"Otros géneros", v:"--c-fuera", desc:"Pop comercial y latino, electrónica, hip hop, jazz, flamenco, clásica, teatro y musicales, Candlelight…"}];
const GV = Object.fromEntries(GRUPOS.map(g=>[g.id,g.v]));
const DEF_GRUPOS = GRUPOS.filter(g=>g.id!=="fuera de foco").map(g=>g.id);
const VISTAS = ["Mes","Semana","Día"];
const INFO = ["Estilos","Fuentes","Informe","Versiones"];
const TABS = [...VISTAS,...INFO];
const ORIGENES = [["todos","Todos"],["es","🇪🇸 Españoles"],["ext","Extranjeros"],["nc","Origen sin confirmar"]];
const store = {
  get(k,d){try{const v=localStorage.getItem("agenda:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("agenda:"+k,JSON.stringify(v))}catch(e){}}
};

const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fmt=(s,o)=>parse(s).toLocaleDateString("es-ES",o);
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};

function textoDe(r){return norm([r.artista,(r.invitados||[]).join(" "),r.sala,r.municipio,r.ciclo,(r.estilos_discogs||[]).join(" "),(r.genero_discogs||[]).join(" ")].join(" "));}
function pasaTexto(r){
  if(!state.q.trim()) return true;
  const hay=r._t||(r._t=textoDe(r));
  return norm(state.q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function pasaOrigen(r){
  if(state.origen==="es") return r.nacionalidad==="ES";
  if(state.origen==="ext") return !!r.nacionalidad && r.nacionalidad!=="ES";
  if(state.origen==="nc") return !r.nacionalidad;
  return true;
}
// Un concierto pasa si está en un género elegido; si en ese género se han elegido estilos concretos, además
// tiene que tener alguno (según las webs de música). Los clasificados solo por una etiqueta genérica de la
// agenda ("Pop / Rock") se pueden excluir.
function pasaGrupo(r){
  if(r.grupos_generico&&!state.genericos) return false;
  const gs=grupos(r), est=r.estilos_discogs||[];
  return state.grupos.some(g=>gs.includes(g)&&(!(state.estilos[g]||[]).length||est.some(s=>state.estilos[g].includes(s))));
}
function visible(r){ return pasaGrupo(r) && pasaTexto(r) && pasaOrigen(r); }
function byDate(){const m={}; for(const r of DATA){ if(!visible(r)) continue; (m[r.fecha]=m[r.fecha]||[]).push(r);} return m;}
const nEstilos=()=>Object.values(state.estilos).reduce((n,l)=>n+(l||[]).length,0);
const esDefecto=()=>DEF_GRUPOS.every(g=>state.grupos.includes(g))&&!state.grupos.includes("fuera de foco")&&!nEstilos()&&state.genericos;
function nFiltros(){ return (esDefecto()?0:1)+(state.origen!=="todos"?1:0); }
function resumenFiltros(){
  const p=[];
  if(!esDefecto()){
    if(GRUPOS.every(g=>state.grupos.includes(g.id))) p.push("todos los géneros");
    else if(!state.grupos.length) p.push("ningún género");
    else p.push(GRUPOS.filter(g=>state.grupos.includes(g.id)).map(g=>g.nombre+((state.estilos[g.id]||[]).length?` (${state.estilos[g.id].join(", ")})`:"")).join(", "));
    if(!state.genericos) p.push("sin etiquetas genéricas");
  }
  if(state.origen!=="todos") p.push(ORIGENES.find(o=>o[0]===state.origen)[1].replace("🇪🇸 ",""));
  return p.join(" · ");
}

function grupoDeEstilo(s){
  if(!MAP||!TAXO) return null;
  for(const [g,l] of Object.entries(MAP.discogs_a_categoria)) if(Array.isArray(l)&&l.includes(s)) return g;
  for(const [gen,l] of Object.entries(TAXO.generos)) if(l.includes(s)) return MAP.genero_a_categoria[gen]||"fuera de foco";
  return "fuera de foco";
}
function todosLosEstilos(){
  if(!TAXO||!MAP) return [];
  const out=new Set();
  Object.values(TAXO.generos).forEach(l=>l.forEach(x=>out.add(x)));
  Object.values(MAP.discogs_a_categoria).forEach(l=>Array.isArray(l)&&l.forEach(x=>out.add(x)));
  return [...out];
}

     <label class="grp" style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px"><input type="checkbox" id="fgenok" ${genOk?"checked":""} style="margin-top:3px"><span><b>Incluir etiquetas genéricas de la agenda</b><br><span class="hint">Conciertos de artistas sin ficha que la agenda solo etiqueta como "Pop / Rock", "Músicas negras"… Aparecen en todos esos géneros porque no se sabe cuál es.</span></span></label>

// ---------------------------------------------------------------- tarjeta (lista)
function horaCard(r){
  if(r.hora) return r.hora;
  const c=(r.conflictos||[]).find(c=>c.campo==="hora"&&c.versiones&&c.versiones.length);
  return c?[...c.versiones].sort((a,b)=>b.fuentes.length-a.fuentes.length)[0].valor+" ?":"";
}
function horaTxt(r){ return r.hora||(r.conflictos||[]).filter(c=>c.campo==="hora").map(c=>c.versiones.map(v=>v.valor).join(" ó ")).join("")||""; }
function etiquetaAgenda(r){
  // la etiqueta de la agenda a veces es el nombre de un ciclo o de la sala ("Villanos del Jazz"): no es un estilo
  const salaTok=norm(r.sala).split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!["sala","club","teatro","madrid"].includes(t));
  return (r.estilo_fuente||[]).map(e=>e.estilo).find(e=>{const n=norm(e); return !(r.ciclo&&n.includes(norm(r.ciclo)))&&!salaTok.some(t=>n.includes(t))&&!/^otros?$/.test(n);});
}
function estiloTags(r,n){
  const e=(r.estilos_discogs||[]).slice(0,n);
  if(e.length) return e.map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  if((r.genero_discogs||[]).length) return r.genero_discogs.slice(0,n).map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  const a=(etiquetaAgenda(r)||"").replace(/_/g," ");
  if(a&&r.grupos_generico) return `<span class="tag ag" title="Etiqueta genérica de la agenda: no se sabe el estilo concreto">${esc(a)} · genérico</span>`;
  return a?`<span class="tag ag" title="Etiqueta de la agenda, no de una web de música">${esc(a)}</span>`:"";
}
function estadoMini(r){
  if(r.estado==="conflicto"){
    const campos=[...new Set((r.conflictos||[]).map(c=>({hora:"hora",sala:"sala",cartel:"cartel"})[c.campo]).filter(Boolean))];
    return `<span class="st st-conf" title="Las webs no coinciden: abre el concierto para ver cada versión">⚠ ${campos.length?esc(campos.join(" y "))+" sin confirmar":"datos distintos"}</span>`;
  }
  if(r.estado==="posiblemente cancelado") return `<span class="st st-canc">¿cancelado?</span>`;
  return "";
}
function card(r){
  const im=img(r), h=horaCard(r);
  return `<a class="card" href="#concierto/${esc(r.id)}" style="--gc:var(${color(r)})">
   ${im?`<img class="thumb" src="${esc(im.url)}" alt="" width="60" height="60" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;thumb&quot;>${iniciales(r.artista)}</span>'">`:`<span class="thumb">${iniciales(r.artista)}</span>`}
   <div class="cbody"><div class="art">${esc(r.artista)}</div>
   ${r.invitados&&r.invitados.length?`<div class="sub">+ ${r.invitados.map(esc).join(" + ")}</div>`:""}
   <div class="sub">${h?`<b>${esc(h)}</b> · `:""}${esc(r.sala||"sala sin indicar")}${r.municipio&&r.municipio!=="Madrid"?` · ${esc(r.municipio)}`:""}</div>
   <div class="tags">${r.nacionalidad?`<span class="flag" title="${esc(pais(r.nacionalidad))}">${flag(r.nacionalidad)}</span>`:""}${estiloTags(r,2)}${estadoMini(r)}</div></div><span class="chev" aria-hidden="true">›</span></a>`;
}
// estado vacío que dice por qué: sin conciertos anunciados, o todos ocultos por los filtros (con un botón)
function vacioHTML(ocultos,cuando){

// ---------------------------------------------------------------- ficha detallada
function icsDe(r){
  const d=r.fecha.replace(/-/g,""), h=(r.hora||"").replace(":","");
  const ini=h?`DTSTART;TZID=Europe/Madrid:${d}T${h}00`:`DTSTART;VALUE=DATE:${d}`;
  const fin=h?`DURATION:PT3H`:`DTEND;VALUE=DATE:${addDays(r.fecha,1).replace(/-/g,"")}`;
  const t=s=>String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//agenda-conciertos//ES","BEGIN:VEVENT",`UID:${r.id}@agenda-conciertos`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,ini,fin,`SUMMARY:${t(r.artista)}`,
    `LOCATION:${t((r.sala||"")+", "+(r.municipio||"Madrid"))}`,`URL:${location.href.split("#")[0]}#concierto/${r.id}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function descargarIcs(r){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([icsDe(r)],{type:"text/calendar"}));
  a.download=`${norm(r.artista).replace(/[^a-z0-9]+/g,"-").slice(0,40)||"concierto"}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function compartir(r){
  const url=`${location.href.split("#")[0]}#concierto/${r.id}`;
  const text=`${r.artista} · ${fmt(r.fecha,{weekday:"short",day:"numeric",month:"short"})}${r.hora?" "+r.hora:""} · ${r.sala}`;
  try{ if(navigator.share){ await navigator.share({title:r.artista,text,url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(`${text}\n${url}`); toast("Enlace copiado"); }catch(e){ prompt("Copia el enlace:",url); }
}
function estadoBox(r){
  const conflictos=(r.conflictos||[]).filter(c=>c.versiones&&c.versiones.length);
  if(r.estado==="conflicto"){
    const nom={hora:"Hora",sala:"Sala",cartel:"Cartel"};
    const items=conflictos.map(c=>{
      const vs=[...c.versiones].sort((a,b)=>b.fuentes.length-a.fuentes.length);
      const horas=c.campo==="hora"?vs.map(v=>v.valor).sort():[];
      return `<div><b>${esc(nom[c.campo]||c.campo)}</b></div><div class="vers">${vs.map(v=>`<div><b>${esc(v.valor)}</b><span class="muted">${plural(v.fuentes.length,"web")}: ${esc(v.fuentes.map(x=>x.split(" (")[0]).filter((x,i,a)=>a.indexOf(x)===i).join(", "))}</span></div>`).join("")}</div>
        ${c.campo==="hora"&&horas.length>1?`<div class="hint" style="margin-top:4px">Si una hora es bastante anterior, suele ser la apertura de puertas. Confírmalo en la web de la sala o de las entradas.</div>`:""}`;
    }).join("");
    const man=(r.notas||[]).filter(n=>/Corrección manual/.test(n)).map(n=>`<div class="hint">${esc(n)}</div>`).join("");
    return `<div class="box box-bad"><b>⚠ Las webs no coinciden</b>${items}${man}</div>`;
  }
  if(r.estado==="posiblemente cancelado")
    return `<div class="box box-warn"><b>¿Cancelado?</b> Ya no aparece en ninguna de las webs donde se anunciaba. Visto por última vez el ${esc(r.ultima_vez_visto||"—")}.</div>`;
  if(r.confirmado_sala)

function navHTML(prev,next,title,lblPrev,lblNext,esHoy){
  return `<div class="nav"><button class="iconbtn" data-nav="${prev}" aria-label="${lblPrev}">‹</button><div class="title">${title}</div>${esHoy?"":`<button class="hoy" id="hoy">Hoy</button>`}<button class="iconbtn" data-nav="${next}" aria-label="${lblNext}">›</button></div>`;
}
function stripHTML(mon,bd,modo){
  return `<div class="strip">${[0,1,2,3,4,5,6].map(i=>{const f=addDays(mon,i), n=(bd[f]||[]).length;
    return `<button data-${modo}="${f}" class="${f===state.date&&modo==="sel"?"sel":""}${f===HOY?" hoyd":""}${f<HOY?" past":""}" aria-label="${esc(fmt(f,{weekday:"long",day:"numeric"}))}: ${plural(n,"concierto")}"><span class="d">${esc(fmt(f,{weekday:"short"}).slice(0,2))}</span><span class="n">${parse(f).getDate()}</span><span class="c">${n||"–"}</span></button>`}).join("")}</div>`;
}
function viewMes(){
  const d=parse(state.date); const y=d.getFullYear(), m=d.getMonth();
  const first=iso(new Date(y,m,1)); const start=mondayOf(first);
  const bd=byDate(); let cells="", total=0;
  for(let i=0;i<42;i++){
    const f=addDays(start,i); const fd=parse(f); if(i>=35&&fd.getMonth()!==m) break;
    const fuera=fd.getMonth()!==m;
    const list=fuera?[]:(bd[f]||[]); total+=list.length; const counts={}; list.forEach(r=>{const g=grupos(r)[0]; counts[g]=(counts[g]||0)+1;});
    const stack=GRUPOS.filter(g=>counts[g.id]).map(g=>`<i style="flex:${counts[g.id]};background:var(${g.v})"></i>`).join("");
    cells+=`<button class="day${fuera?" out":""}${f<HOY?" past":""}${f===HOY?" today":""}${list.length?"":" zero"}" data-day="${f}" ${fuera?'tabindex="-1" aria-hidden="true"':""} aria-label="${esc(fmt(f,{weekday:"long",day:"numeric",month:"long"}))}: ${plural(list.length,"concierto")}"><span class="n">${fd.getDate()}</span><span class="cnt">${list.length||""}</span>${list.length?`<span class="stack">${stack}</span>`:""}</button>`;
  }
  const mesHoy=HOY.slice(0,7)===first.slice(0,7);
  return navHTML(-1,1,`${esc(fmt(first,{month:"long",year:"numeric"}))}<div class="hint" style="font-weight:500">${plural(total,"concierto")}</div>`,"Mes anterior","Mes siguiente",mesHoy)+
   `<div class="cal">${["L","M","X","J","V","S","D"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>

function viewSemana(){

function mdToHtml(md){
  const lines=md.split("\n"); let out="", inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2">$1</a>');
  for(const l of lines){
    if(/^\s*[-*] /.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`; continue; }
    if(inList){out+="</ul>";inList=false;}
    const h=l.match(/^(#{1,3}) (.*)/); if(h){out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue;}
    if(l.trim()) out+=`<p>${inline(l)}</p>`;
  }
  return out+(inList?"</ul>":"");
}

let lastHash="";
function setHash(){
  const h=state.tab==="Concierto"?`#concierto/${state.id}`:`#${norm(state.tab)}${VISTAS.includes(state.tab)?"/"+state.date:""}`;
  if(location.hash!==h) history.replaceState(null,"",h);
  lastHash=h;
}
function readHash(){
  const m=location.hash.slice(1).split("/");
  if(m[0]==="concierto"&&m[1]){
    if(!lastHash.startsWith("#concierto")) state.from=lastHash||null;
    state.tab="Concierto"; state.id=decodeURIComponent(m[1]); const r=BYID[state.id]; if(r) state.date=r.fecha; return;
  }
  const t=TABS.find(x=>norm(x)===m[0]); if(t) state.tab=t;
  if(m[1]&&/^\d{4}-\d{2}-\d{2}$/.test(m[1])) state.date=m[1];
}
function renderTabs(){
  const act=state.tab==="Concierto"?null:state.tab;
  document.getElementById("tabs").innerHTML=VISTAS.map(t=>`<button role="tab" aria-selected="${t===act}" data-tab="${t}">${t}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; store.set("tab",state.tab); render(); scrollTo(0,0);});
  const hh=document.getElementById("hdr").offsetHeight; document.documentElement.style.setProperty("--hh",hh+"px");
}
// ---------------------------------------------------------------- detalle bajo demanda
// La agenda ligera (data/agenda.json) no trae fuentes, ficha, precio ni notas: se piden por días al abrir un
// concierto (data/detalles/AAAA-MM-DD.json, unos pocos KB).
const pedidos={};
async function asegurarDetalle(id){
  const r=BYID[id]; if(!r||r._full||!DETALLES) return true;
  const f=r.fecha;
  pedidos[f]=pedidos[f]||fetch("data/"+DETALLES.replace("{fecha}",f),{cache:"no-cache"}).then(x=>{if(!x.ok) throw new Error(x.status); return x.json();});
  try{ const d=await pedidos[f]; Object.entries(d).forEach(([k,v])=>{const x=BYID[k]; if(x){Object.assign(x,v); x._full=true;}}); return true; }
  catch(e){ delete pedidos[f]; return false; }
}
async function renderBody(keepFocus){
  const main=document.getElementById("main");
  if(state.tab==="Concierto"&&BYID[state.id]&&!BYID[state.id]._full&&DETALLES){
    main.innerHTML=`<div class="dt"><div class="skel skel-hero"></div><div class="skel skel-l"></div><div class="skel skel-m"></div><div class="skel skel-m"></div></div>`;
    if(!await asegurarDetalle(state.id)){ main.innerHTML=`<a class="back" href="#dia/${state.date||HOY}">‹ Volver</a><p class="empty">No se pudo cargar el detalle del concierto. Comprueba la conexión y vuelve a intentarlo.</p>`; return; }
  }
  const withFilters=VISTAS.includes(state.tab);
  let body="";
  if(withFilters&&state.q.trim()) body=viewBusqueda();
  else if(state.tab==="Mes") body=viewMes(); else if(state.tab==="Semana") body=viewSemana(); else if(state.tab==="Día") body=viewDia();
  else if(state.tab==="Concierto") body=viewConcierto();
  else {
    const back=`<a class="back" href="#mes/${state.date||HOY}">‹ Agenda</a><h2 style="margin:4px 0 10px">${esc(state.tab)}</h2>`;
    if(state.tab==="Estilos") body=back+viewEstilos(); else if(state.tab==="Fuentes") body=back+viewFuentes();
    else if(state.tab==="Informe") body=back+viewInforme(); else body=back+await viewVersiones();
  }
  if(withFilters&&keepFocus&&document.getElementById("fbody")) document.getElementById("fbody").innerHTML=body;
  else { main.innerHTML=withFilters?filtersHTML()+`<div id="fbody">${body}</div>`:body; if(withFilters) bindFilters(); }
  bindBody();
  setHash();
}
function bindBody(){
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{state.date=b.dataset.day; state.tab="Día"; render(); scrollTo(0,0);});
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{state.date=b.dataset.sel; renderBody(true);});
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const el=document.getElementById("d-"+b.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth"}); else toast("Ese día no hay conciertos con estos filtros");});
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    const n=Number(b.dataset.nav);
    if(state.tab==="Mes"){const d=parse(state.date); state.date=iso(new Date(d.getFullYear(),d.getMonth()+n,1));}
    else state.date=addDays(state.date,n);
    renderBody(true);
  });
  const hoy=document.getElementById("hoy"); if(hoy) hoy.onclick=()=>{state.date=HOY; renderBody(true);};
  document.querySelectorAll("[data-quitar]").forEach(b=>b.onclick=()=>{setGrupos(GRUPOS.map(g=>g.id)); state.origen="todos"; store.set("origen","todos"); state.estilos={}; store.set("estilos",{}); state.genericos=true; store.set("genericos",true); renderBody(false);});
  const vt=document.getElementById("vertodo"); if(vt) vt.onclick=()=>{setGrupos(GRUPOS.map(g=>g.id)); state.origen="todos"; store.set("origen","todos"); renderBody(false);};
  const r=BYID[state.id];
  if(state.tab==="Concierto"&&r){
    const i=document.getElementById("ics"); if(i) i.onclick=()=>descargarIcs(r);
    const s=document.getElementById("share"); if(s) s.onclick=()=>compartir(r);
  }
  const sw=document.getElementById("swipe");
  if(sw){ let x0=null,y0=null;
    sw.ontouchstart=e=>{x0=e.touches[0].clientX; y0=e.touches[0].clientY;};
    sw.ontouchend=e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)){ state.date=addDays(state.date,dx<0?1:-1); renderBody(true); } };
  }
}
function render(){ document.getElementById("sheet").innerHTML=""; document.getElementById("menu").innerHTML=""; renderTabs(); renderBody(false); }

async function load(){
  const j=async u=>{const r=await fetch(u,{cache:"no-cache"}); if(!r.ok) throw new Error(u); return r.json();};
  // agenda ligera; si no está (copia antigua de la web), el archivo completo
  const agenda=()=>j("data/agenda.json").catch(()=>j("data/concerts.json"));
  try{
    const [c,inf,tax,sal,map]=await Promise.all([agenda(),j("data/informe.json").catch(()=>null),j("data/taxonomia.json").catch(()=>null),j("data/salas_alias.json").catch(()=>null),j("data/estilos_map.json").catch(()=>null)]);
    DATA=c.conciertos||[]; DETALLES=c.detalles||null; INFORME=inf; TAXO=tax; MAP=map; HOY=iso(new Date());
    DATA.forEach(r=>{BYID[r.id]=r; if(!DETALLES) r._full=true;});
    if(sal) sal.salas.forEach(s=>{SALAS[norm(s.nombre)]=s;});
    const horas=(Date.now()-new Date(c.generado))/36e5;
    const u=document.getElementById("upd");
    u.textContent=`${DATA.filter(r=>r.fecha>=HOY).length} conciertos · actualizado ${new Date(c.generado).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`;
    // la actualización diaria no ha llegado (fallo de GitHub, sin conexión y datos guardados…): se avisa
    if(horas>30){ u.textContent+=` · ⚠ datos de hace ${horas<48?Math.round(horas)+" h":Math.round(horas/24)+" días"}`; u.classList.add("viejo"); }
  }catch(e){ document.getElementById("main").innerHTML=`<p class="empty">No se pudieron cargar los datos (${esc(e.message)}). Comprueba la conexión y recarga la página.</p>`; return; }
  state.tab=store.get("tab","Mes"); if(!VISTAS.includes(state.tab)) state.tab="Mes"; state.date=HOY; readHash(); render();
}
addEventListener("hashchange",()=>{readHash(); render(); if(state.tab==="Concierto") scrollTo(0,0);});
addEventListener("resize",()=>{const h=document.getElementById("hdr"); if(h) document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");});
load();
// copia local de la web y de los últimos datos: si la red o GitHub Pages fallan, se sigue viendo la agenda
if("serviceWorker" in navigator&&location.protocol==="https:") addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
