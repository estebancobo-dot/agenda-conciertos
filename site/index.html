<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conciertos Madrid</title>
<meta name="description" content="Agenda automática de conciertos en la Comunidad de Madrid: rock, metal, blues, americana, folk, punk, pop e indie. Datos trazables a sus fuentes.">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Cpath d='M40 12v26a8 8 0 1 1-4-6.9V18l-12 3v21a8 8 0 1 1-4-6.9V16z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#efede8; --ink:#1b1c1f; --muted:#5d6066; --line:#dcd9d2;
  --accent:#c2410c; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --c-rock:#b91c1c; --c-pop:#7c3aed; --c-amer:#a16207; --c-blues:#1d4ed8; --c-punk:#be185d; --c-cant:#0f766e;
  --c-trib:#c2410c; --c-fuera:#6b7280; --c-sin:#334155;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--info)}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1rem;margin:0;flex:1;min-width:0;line-height:1.25}
.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:960px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;font-weight:600;font-size:.92rem}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{max-width:960px;margin:0 auto;padding:12px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1 1 200px;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel)}
.fbtn{height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.fbtn b{font-weight:700}
.fbtn .sum{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select.fbtn{appearance:auto}
.nav{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.nav .title{flex:1;font-weight:700;text-align:center}
.nav .title::first-letter,.dayhead::first-letter{text-transform:uppercase}
.nav input[type=date]{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 8px;max-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:62px;padding:4px;display:flex;flex-direction:column;cursor:pointer;text-align:left}
.day.out,.day.past{opacity:.4}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;opacity:1}
.day .n{font-size:.78rem;color:var(--muted)}
.day .cnt{font-size:1.05rem;font-weight:800;margin-top:auto}
.day .cnt:empty{display:none}
.day .stack{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:3px;background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dayhead{margin:18px 0 8px;font-weight:800;display:block}
.dayhead small{color:var(--muted);font-weight:500;margin-left:8px}
/* tarjeta */
.card{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c-sin);border-radius:var(--radius);padding:10px;margin:8px 0;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.thumb{flex:0 0 56px;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:1.1rem;overflow:hidden}
.cbody{flex:1;min-width:0}
.cl1{display:flex;gap:8px;align-items:baseline}
.hora{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.art{font-weight:800;font-size:1.02rem;word-break:break-word}
.sub{color:var(--muted);font-size:.86rem;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center}
.tag{font-size:.75rem;border-radius:6px;padding:1px 6px;background:var(--panel2);color:var(--ink)}
.tag.ag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.flag{font-size:1rem;line-height:1}
.st{font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.st-conf{color:var(--bad)} .st-canc{color:var(--warn)} .st-ok{color:var(--ok)}
/* ficha */
.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;text-decoration:none}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:16/10;max-height:380px;width:100%}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;color:var(--muted)}
.credit{font-size:.72rem;color:var(--muted);margin-top:4px}
.dt h2{font-size:1.5rem;margin:12px 0 2px;line-height:1.2}
.dt .ciclo{color:var(--muted);font-size:.9rem}
.dt .inv{color:var(--muted);margin-top:2px}
.facts{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
@media (min-width:600px){.facts{grid-template-columns:1fr 1fr}}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.fact .v{font-size:1.02rem;font-weight:600;margin-top:2px}
.fact .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.box{border-radius:12px;padding:10px 12px;margin:10px 0;border:1px solid}
.box-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.box-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.box-warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.box ul{margin:6px 0 0;padding-left:20px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.lbtn{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;color:var(--ink);font-size:.9rem}
.lbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.more{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.more summary{cursor:pointer;font-weight:600}
details.more ul{padding-left:20px;margin:8px 0}
/* panel de géneros */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);z-index:21;border-radius:18px 18px 0 0;padding:14px 16px 24px;max-width:720px;margin:0 auto}
.sheet h3{margin:0 0 4px}
.presets{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:6px 0}
.grp label{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.grp input{width:20px;height:20px}
.grp .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.grp .nm{flex:1;font-weight:600}
.grp .ct{color:var(--muted);font-size:.85rem}
.grp details{padding:0 12px 10px}
.grp summary{cursor:pointer;color:var(--info);font-size:.85rem}
.grp .inc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.grp .inc span{font-size:.75rem;background:var(--panel2);border-radius:6px;padding:1px 6px}
.grp .inc span.has{outline:1px solid var(--ok)}
.hint{color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:1.4rem}
.kpi span{color:var(--muted);font-size:.8rem}
.s-ok{color:var(--ok);font-weight:700} .s-err{color:var(--bad);font-weight:700} .s-warn{color:var(--warn);font-weight:700}
.genre{margin:14px 0}
.genre h3{margin:0 0 6px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.style{font-size:.84rem;border:1px solid var(--line);border-radius:8px;padding:3px 8px;text-decoration:none;color:var(--muted);background:var(--panel)}
.style.has{border-color:var(--ok);color:var(--ok);font-weight:700;background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.md h1,.md h2{font-size:1.1rem;margin:18px 0 6px} .md h3{font-size:1rem;margin:14px 0 4px}
.md ul{padding-left:20px} .md code{background:var(--panel2);padding:1px 4px;border-radius:4px}
.muted{color:var(--muted)}
.dl{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px;height:40px;color:var(--ink)}
@media (min-width:700px){.day{min-height:78px}}
@media (max-width:420px){.dl{padding:0 8px}.nav input[type=date]{max-width:120px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Conciertos · Comunidad de Madrid<small id="upd">Cargando…</small></h1>
    <a class="dl" href="data/concerts.csv" download title="Descargar concerts.csv para Excel">⬇ CSV</a>
    <button class="iconbtn" id="theme" title="Cambiar modo claro/oscuro" aria-label="Cambiar modo claro u oscuro">◐</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"><p class="empty">Cargando datos…</p></main>
<div id="sheet"></div>
<script>
"use strict";
// ---------------------------------------------------------------- grupos (agrupaciones de estilos de Discogs)
const GRUPOS = [
  {id:"rock y metal", nombre:"Rock y metal", v:"--c-rock", desc:"Hard rock, heavy metal, AOR, prog, stoner, psicodelia, grunge, rock clásico y alternativo…"},
  {id:"punk y garage", nombre:"Punk y garage", v:"--c-punk", desc:"Punk, hardcore, garage, post-punk, rock & roll, rockabilly, surf…"},
  {id:"pop e indie", nombre:"Pop e indie", v:"--c-pop", desc:"Indie rock, indie pop, pop rock, power pop, shoegaze, new wave…"},
  {id:"americana/country/folk", nombre:"Americana, country y folk", v:"--c-amer", desc:"Country, country rock, folk, folk rock, southern rock, bluegrass…"},
  {id:"blues", nombre:"Blues", v:"--c-blues", desc:"Todos los estilos de blues y el blues rock."},
  {id:"cantautor", nombre:"Cantautores", v:"--c-cant", desc:"Solo por la etiqueta de la agenda (Discogs no tiene este estilo)."},
  {id:"tributos y versiones", nombre:"Tributos y versiones", v:"--c-trib", desc:"Bandas tributo y de versiones (por la agenda o el título)."},
  {id:"sin clasificar", nombre:"Sin clasificar", v:"--c-sin", desc:"Ni Discogs, ni Wikipedia, ni la agenda dan estilo. Se muestran para no perder conciertos."},
  {id:"fuera de foco", nombre:"Fuera de foco", v:"--c-fuera", desc:"Electrónica, hip hop, jazz, latina, flamenco, clásica, musicales, Candlelight…"}];
const GV = Object.fromEntries(GRUPOS.map(g=>[g.id,g.v]));
const FOCO = GRUPOS.filter(g=>g.id!=="fuera de foco").map(g=>g.id);
const TABS = ["Mes","Semana","Día","Estilos","Fuentes","Informe","Versiones"];
const store = {
  get(k,d){try{const v=localStorage.getItem("agenda:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("agenda:"+k,JSON.stringify(v))}catch(e){}}
};
let DATA=[], BYID={}, INFORME=null, TAXO=null, SALAS={}, MAP=null, HOY=null;
let state = {tab:"Mes", date:null, id:null, q:store.get("q",""), grupos:store.get("grupos2",FOCO), origen:store.get("origen","todos")};
let regionNames=null; try{regionNames=new Intl.DisplayNames(["es"],{type:"region"})}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>parse(s).toLocaleDateString("es-ES",o);
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const flag=c=>/^[A-Z]{2}$/.test(c||"")?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):"";
const pais=c=>{if(!c)return "";try{return regionNames?regionNames.of(c):c}catch(e){return c}};
const iniciales=n=>esc(String(n||"?").replace(/^(the|los|las|la|el)\s+/i,"").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase());
const grupos=r=>(r.grupos&&r.grupos.length?r.grupos:[r.categoria]);
const color=r=>GV[grupos(r)[0]]||"--c-sin";
const img=r=>r.imagen&&r.imagen.url?r.imagen:null;

function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(store.get("theme",null));
document.getElementById("theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark"; applyTheme(next); store.set("theme",next);
};

// ---------------------------------------------------------------- filtros
function pasaTexto(r){
  if(!state.q) return true;
  const hay=norm([r.artista,(r.invitados||[]).join(" "),r.sala,r.municipio,r.ciclo,(r.estilos_discogs||[]).join(" ")].join(" "));
  return norm(state.q).split(/\s+/).every(w=>hay.includes(w));
}
function pasaOrigen(r){
  if(state.origen==="es") return r.nacionalidad==="ES";
  if(state.origen==="ext") return r.nacionalidad && r.nacionalidad!=="ES";
  if(state.origen==="nc") return !r.nacionalidad;
  return true;
}
function visible(r){ return grupos(r).some(c=>state.grupos.includes(c)) && pasaTexto(r) && pasaOrigen(r); }
function byDate(){const m={}; for(const r of DATA){ if(!visible(r)) continue; (m[r.fecha]=m[r.fecha]||[]).push(r);} return m;}
function resumenGrupos(){
  const s=state.grupos;
  if(FOCO.every(g=>s.includes(g))&&!s.includes("fuera de foco")) return "Mi foco";
  if(GRUPOS.every(g=>s.includes(g.id))) return "Todos";
  if(!s.length) return "Ninguno";
  return GRUPOS.filter(g=>s.includes(g.id)).map(g=>g.nombre).join(", ");
}
function filtersHTML(){
  return `<div class="bar"><input class="search" id="q" type="search" placeholder="Buscar artista, sala, municipio o estilo" value="${esc(state.q)}" aria-label="Buscar">
   <button class="fbtn" id="fgen" aria-haspopup="dialog"><b>Géneros:</b> <span class="sum">${esc(resumenGrupos())}</span> ▾</button>
   <select class="fbtn" id="forig" aria-label="Origen del artista">
     <option value="todos"${state.origen==="todos"?" selected":""}>Origen: todos</option>
     <option value="es"${state.origen==="es"?" selected":""}>🇪🇸 Españoles</option>
     <option value="ext"${state.origen==="ext"?" selected":""}>🌐 Extranjeros</option>
     <option value="nc"${state.origen==="nc"?" selected":""}>Origen sin confirmar</option></select></div>`;
}
function bindFilters(){
  const q=document.getElementById("q");
  if(q) q.oninput=()=>{state.q=q.value; store.set("q",state.q); renderBody(true);};
  const o=document.getElementById("forig"); if(o) o.onchange=()=>{state.origen=o.value; store.set("origen",state.origen); renderBody(true);};
  const g=document.getElementById("fgen"); if(g) g.onclick=openSheet;
}
function grupoDeEstilo(s){
  if(!MAP||!TAXO) return null;
  for(const [g,l] of Object.entries(MAP.discogs_a_categoria)) if(Array.isArray(l)&&l.includes(s)) return g;
  for(const [gen,l] of Object.entries(TAXO.generos)) if(l.includes(s)) return MAP.genero_a_categoria[gen]||"fuera de foco";
  return "fuera de foco";
}
function openSheet(){
  const fut=DATA.filter(r=>r.fecha>=HOY&&pasaTexto(r)&&pasaOrigen(r));
  const cnt={}, est={}, ag={};
  fut.forEach(r=>{grupos(r).forEach(g=>{cnt[g]=(cnt[g]||0)+1; if(r.grupos_origen==="agenda") ag[g]=(ag[g]||0)+1;});
    (r.estilos_discogs||[]).forEach(s=>{const g=grupoDeEstilo(s); if(!g) return; est[g]=est[g]||{}; est[g][s]=(est[g][s]||0)+1;});});
  const incluye=g=>{
    if(!MAP) return [];
    if(g==="rock y metal") return (TAXO?TAXO.generos.Rock:[]).filter(s=>!Object.values(MAP.discogs_a_categoria).some(l=>Array.isArray(l)&&l.includes(s)));
    const l=MAP.discogs_a_categoria[g]; return Array.isArray(l)?l:[];
  };
  const el=document.getElementById("sheet");
  el.innerHTML=`<div class="sheet-bg" id="sbg"></div><div class="sheet" role="dialog" aria-label="Filtrar por géneros">
   <h3>Géneros</h3>
   <p class="hint">Cada grupo reúne estilos de <b>Discogs</b> (o de Wikipedia traducidos a Discogs). Si el artista no tiene ficha en ninguna de las dos, se usa la etiqueta de la agenda y se indica.</p>
   <div class="presets"><button data-p="foco">Mi foco</button><button data-p="todo">Todo</button><button data-p="nada">Ninguno</button></div>
   ${GRUPOS.map(g=>{const e=est[g.id]||{}; const inc=incluye(g.id); const extra=Object.keys(e).filter(s=>!inc.includes(s));

function estiloTags(r,n){

function estadoMini(r){

function viewConcierto(){

function viewMes(){
  const d=parse(state.date); const y=d.getFullYear(), m=d.getMonth();
  const first=iso(new Date(y,m,1)); const start=mondayOf(first);
  const bd=byDate(); let cells="";
  for(let i=0;i<42;i++){
    const f=addDays(start,i); const fd=parse(f); if(i>=35&&fd.getMonth()!==m) break;
    const list=bd[f]||[]; const counts={}; list.forEach(r=>{const g=grupos(r)[0]; counts[g]=(counts[g]||0)+1;});
    const stack=GRUPOS.filter(g=>counts[g.id]).map(g=>`<i style="flex:${counts[g.id]};background:var(${g.v})" title="${esc(g.nombre)}: ${counts[g.id]}"></i>`).join("");
    cells+=`<button class="day${fd.getMonth()!==m?" out":""}${f<HOY?" past":""}${f===HOY?" today":""}" data-day="${f}" aria-label="${esc(fmt(f,{weekday:"long",day:"numeric",month:"long"}))}: ${list.length} conciertos"><span class="n">${fd.getDate()}</span><span class="cnt">${list.length||""}</span><span class="stack">${stack}</span></button>`;
  }
  return `<div class="nav"><button class="iconbtn" data-nav="-1" aria-label="Mes anterior">‹</button><div class="title">${esc(fmt(first,{month:"long",year:"numeric"}))}</div><button class="iconbtn" data-nav="1" aria-label="Mes siguiente">›</button></div>
   <div class="cal">${["L","M","X","J","V","S","D"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
   <div class="legend">${GRUPOS.map(g=>`<span><i style="background:var(${g.v})"></i>${esc(g.nombre)}</span>`).join("")}</div>`;
}

   <h3>Fuera de ámbito (otras provincias)</h3><p class="muted">${esc(t.fuera_de_ambito)} eventos descartados. Ejemplos:</p><ul class="muted">${(t.ejemplos_fuera_de_ambito||[]).slice(0,10).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

function mdToHtml(md){
  const lines=md.split("\n"); let out="", inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2">$1</a>');
  for(const l of lines){
    if(/^\s*[-*] /.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`; continue; }
    if(inList){out+="</ul>";inList=false;}
    const h=l.match(/^(#{1,3}) (.*)/); if(h){out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue;}
    if(l.trim()) out+=`<p>${inline(l)}</p>`;
  }
  return out+(inList?"</ul>":"");
}
async function viewVersiones(){
  try{const r=await fetch("CHANGELOG.md",{cache:"no-cache"}); return `<div class="md">${mdToHtml(await r.text())}</div>`;}
  catch(e){return `<p class="empty">No se pudo leer CHANGELOG.md</p>`;}
}

function setHash(){

function readHash(){
  const m=location.hash.slice(1).split("/");
  if(m[0]==="concierto"&&m[1]){ state.tab="Concierto"; state.id=decodeURIComponent(m[1]); const r=BYID[state.id]; if(r) state.date=r.fecha; return; }
  const t=TABS.find(x=>norm(x)===m[0]); if(t) state.tab=t;
  if(m[1]&&/^\d{4}-\d{2}-\d{2}$/.test(m[1])) state.date=m[1];
}
function renderTabs(){
  const act=state.tab==="Concierto"?"Día":state.tab;
  document.getElementById("tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${t===act}" data-tab="${t}">${t}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; store.set("tab",state.tab); render();});
}
async function renderBody(keepFocus){
  const main=document.getElementById("main");
  const withFilters=["Mes","Semana","Día"].includes(state.tab);
  let body="";
  if(state.tab==="Mes") body=viewMes(); else if(state.tab==="Semana") body=viewSemana(); else if(state.tab==="Día") body=viewDia();
  else if(state.tab==="Concierto") body=viewConcierto();
  else if(state.tab==="Estilos") body=viewEstilos(); else if(state.tab==="Fuentes") body=viewFuentes();
  else if(state.tab==="Informe") body=viewInforme(); else body=await viewVersiones();
  if(withFilters&&keepFocus&&document.getElementById("fbody")) document.getElementById("fbody").innerHTML=body;
  else { main.innerHTML=withFilters?filtersHTML()+`<div id="fbody">${body}</div>`:body; if(withFilters) bindFilters(); }
  const sum=document.querySelector("#fgen .sum"); if(sum) sum.textContent=resumenGrupos();
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{state.date=b.dataset.day; state.tab="Día"; render(); scrollTo(0,0);});
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    const n=Number(b.dataset.nav);
    if(state.tab==="Mes"){const d=parse(state.date); state.date=iso(new Date(d.getFullYear(),d.getMonth()+n,1));}
    else state.date=addDays(state.date,n);
    renderBody(true); setHash();
  });
  const pick=document.getElementById("pick"); if(pick) pick.onchange=()=>{ if(pick.value){state.date=pick.value; renderBody(true); setHash();} };
  setHash();
}
function render(){ renderTabs(); renderBody(false); }

async function load(){
  const j=async u=>{const r=await fetch(u,{cache:"no-cache"}); if(!r.ok) throw new Error(u); return r.json();};
  try{
    const [c,inf,tax,sal,map]=await Promise.all([j("data/concerts.json"),j("data/informe.json").catch(()=>null),j("data/taxonomia.json").catch(()=>null),j("data/salas_alias.json").catch(()=>null),j("data/estilos_map.json").catch(()=>null)]);
    DATA=c.conciertos||[]; INFORME=inf; TAXO=tax; MAP=map; HOY=iso(new Date());
    DATA.forEach(r=>BYID[r.id]=r);
    if(sal) sal.salas.forEach(s=>{SALAS[norm(s.nombre)]=s;});
    document.getElementById("upd").textContent=`Actualizado ${new Date(c.generado).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${DATA.filter(r=>r.fecha>=HOY).length} conciertos`;
  }catch(e){ document.getElementById("main").innerHTML=`<p class="empty">No se pudieron cargar los datos (${esc(e.message)}).</p>`; return; }
  state.tab=store.get("tab","Mes"); if(state.tab==="Concierto") state.tab="Mes"; state.date=HOY; readHash(); render();
}
addEventListener("hashchange",()=>{readHash(); render(); if(state.tab==="Concierto") scrollTo(0,0);});
load();
</script>
