<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link rel="preconnect" href="https://thumb.wikimedia.org">
<title>Conciertos Madrid</title>
<meta name="description" content="Agenda automática de conciertos en la Comunidad de Madrid: rock, metal, blues, americana, folk, punk, indie, synthwave y dark wave. Datos trazables a sus fuentes.">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Cpath d='M40 12v26a8 8 0 1 1-4-6.9V18l-12 3v21a8 8 0 1 1-4-6.9V16z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --panel2:#efede8; --ink:#1b1c1f; --muted:#5d6066; --line:#dcd9d2;
  --accent:#c2410c; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --c-rock:#b91c1c; --c-pop:#7c3aed; --c-amer:#a16207; --c-blues:#1d4ed8; --c-punk:#be185d; --c-cant:#0f766e;
  --c-trib:#c2410c; --c-fuera:#6b7280; --c-sin:#334155; --c-synth:#4d7c0f;
  --c-jazz:#0e7490; --c-soul:#9d174d; --c-flam:#b45309; --c-urb:#4338ca; --c-lat:#15803d; --c-elec:#0369a1;
  --c-clas:#57534e; --c-reg:#3f6212; --c-world:#92400e; --c-popc:#a21caf; --c-esc:#475569;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --c-synth:#a3e635; --shadow:none;
  --c-jazz:#22d3ee; --c-soul:#f9a8d4; --c-flam:#fbbf24; --c-urb:#a5b4fc; --c-lat:#4ade80; --c-elec:#7dd3fc;
  --c-clas:#d6d3d1; --c-reg:#bef264; --c-world:#fdba74; --c-popc:#f0abfc; --c-esc:#94a3b8;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2025; --panel2:#262a30; --ink:#ecebe8; --muted:#a2a6ad; --line:#33383f;
  --accent:#fb923c; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd;
  --c-rock:#f87171; --c-pop:#c4b5fd; --c-amer:#facc15; --c-blues:#60a5fa; --c-punk:#f472b6; --c-cant:#2dd4bf;
  --c-trib:#fb923c; --c-fuera:#9ca3af; --c-sin:#cbd5e1; --c-synth:#a3e635; --shadow:none;
  --c-jazz:#22d3ee; --c-soul:#f9a8d4; --c-flam:#fbbf24; --c-urb:#a5b4fc; --c-lat:#4ade80; --c-elec:#7dd3fc;
  --c-clas:#d6d3d1; --c-reg:#bef264; --c-world:#fdba74; --c-popc:#f0abfc; --c-esc:#94a3b8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--info)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* cabecera */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 6px;max-width:960px;margin:0 auto}
.top h1{font-size:1.05rem;margin:0;flex:1;min-width:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.top .acc{display:none;position:relative}
/* lupa: la búsqueda se abre en la cabecera, sin mover la lista; Cancelar vuelve donde estabas */
.hbus{display:none;flex:1;min-width:0;align-items:center;gap:8px}
header.buscando .hbus{display:flex}
header.buscando .top>:not(.hbus){display:none!important}
#hqi{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel)}
/* al bajar por la lista, el título de la app deja sitio a ‹ periodo › y Hoy (la fila de navegación ya no se ve) */
.hnav{display:none;flex:1;min-width:0;align-items:center;gap:4px}
header.navfija .hnav{display:flex}
header.navfija .top h1{display:none}
.hnav .t{flex:1;min-width:0;text-align:center;font-weight:800;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hnav .t small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.hnav .t::first-letter{text-transform:uppercase}
.hnav .iconbtn{min-width:30px;padding:0 4px}
.hnav .hoy{height:40px;padding:0 7px;font-size:.82rem}
header.navfija .top{gap:5px}
header.navfija .top>.iconbtn{min-width:36px;padding:0 6px}
@media (max-width:359px){.hnav .t{font-size:.8rem}.hnav .t small{font-size:.66rem}header.navfija .top{padding-left:10px;padding-right:10px;gap:3px}header.navfija .top>.iconbtn{min-width:34px;padding:0 4px}}
header.compacto .top .acc{display:inline-flex}
.top .acc svg{width:20px;height:20px}
.top .acc .badge{position:absolute;top:-5px;right:-5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 16px 8px;max-width:960px;margin:0 auto}
.seg button{border:0;background:var(--panel2);padding:7px 0;border-radius:10px;color:var(--muted);font-weight:700;font-size:.92rem}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.menu{position:fixed;right:max(16px,calc((100vw - 960px)/2 + 16px));top:calc(env(safe-area-inset-top) + 52px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:30;min-width:220px;padding:6px}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;text-decoration:none;color:var(--ink);border-radius:8px;text-align:left}
.menu a:hover,.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
main{max-width:960px;margin:0 auto;padding:10px 16px 48px}
/* filtros */
.bar{display:flex;gap:8px;align-items:center}
.sbox{position:relative;flex:1;min-width:0}
.search{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 36px 0 12px;background:var(--panel)}
input[type=search]::-webkit-search-cancel-button{display:none}
.sclear{position:absolute;right:4px;top:4px;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:1.1rem}
.fbtn{height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-weight:600}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:.72rem;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--ink);font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.flag.est{opacity:.55;filter:grayscale(.3)}
.chip .cc{font-size:.72rem;font-weight:500;color:var(--muted)}
/* chip elegido (Material 3 / iOS): relleno oscuro con ✓; sin elegir, solo contorno */
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .cc{color:var(--bg)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:800;margin-right:-2px}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}
.chip.quitar{border-color:var(--ink);font-weight:700}
.active{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.active button{border:0;background:none;color:var(--info);padding:0;font-size:.8rem;text-decoration:underline}
/* navegación de fechas */
.nav{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.nav .title{flex:1;font-weight:800;text-align:center;font-size:1.02rem}
.nav .title::first-letter,.dayhead::first-letter{text-transform:uppercase}
.hoy{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:40px;padding:0 12px;font-weight:600}
.hoy.off{visibility:hidden}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 6px}
.strip button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.strip .d{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.strip .n{font-size:1.05rem;font-weight:800}
.strip .c{font-size:.7rem;color:var(--muted)}
.strip button.hoyd{outline:2px solid var(--accent);outline-offset:-2px}
.strip button.past{background:var(--panel2);border-style:dashed}
.strip button.past .n{color:var(--muted)}
/* el día elegido (vista día) o por el que vas (semana), también si ya pasó: después de .past para que gane */
.strip button.sel,.strip button.en{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.strip button.sel :is(.d,.n,.c),.strip button.en :is(.d,.n,.c){color:var(--bg)}
.stickystrip{position:sticky;top:var(--hh,96px);z-index:3;background:var(--bg);margin:0 -16px;padding:4px 16px 0}
.stickystrip .strip{margin:0}
/* mes */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0;font-weight:700}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:4px 5px;display:flex;flex-direction:column;text-align:left}
.day.out{visibility:hidden}
.day.past .card{filter:grayscale(1)}
.day.past .thumb{opacity:.6}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;opacity:1}
.day .n{font-size:.75rem;color:var(--muted);font-weight:600}
.day .cnt{font-size:1.05rem;font-weight:800;margin-top:auto}
.day .cnt:empty{display:none}
.day .stack{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:3px;background:var(--panel2)}
.day.zero{background:transparent}
.day.finde:not(.zero){background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.dow.finde{color:var(--accent)}
.day.sel{outline:3px solid var(--ink);outline-offset:-3px;opacity:1}
.mhead{margin-top:14px}
.mhead.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,var(--panel))}100%{background:var(--bg)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.76rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* cabecera del día: se queda pegada arriba (debajo de la tira de días, si la hay) mientras bajas por sus conciertos;
   la del día siguiente empuja a la anterior. Una sola línea: fecha completa y cuántos hay */
.dia,.dif{scroll-margin-top:calc(var(--hh,96px) + var(--sh,0px))}
.dayhead{position:sticky;top:calc(var(--hh,96px) + var(--sh,0px));z-index:2;background:var(--bg);margin:12px -16px 0;padding:7px 16px 5px;font-weight:800;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead small{color:var(--muted);font-weight:500}
/* tarjeta */
.card{content-visibility:auto;contain-intrinsic-size:auto 82px;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin:8px 0;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--c-sin))}
.thumb{flex:0 0 60px;width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:1.1rem;overflow:hidden}
.cbody{flex:1;min-width:0}
.art{font-weight:800;font-size:1.02rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--muted);font-size:.86rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:5px;align-items:center}
.tag{font-size:.74rem;border-radius:6px;padding:1px 6px;background:var(--panel2);color:var(--ink)}
.tag.tcart{background:none;border:1px dashed var(--line);color:var(--muted)}
.fest{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px;
  border-radius:5px;padding:1px 5px;background:var(--ink);color:var(--bg)}
.cartel{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:2px}
.cartel li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.cartel li:last-child{border-bottom:none}
.cartel .cn{font-weight:650;flex:1;min-width:0}
.cartel .cn small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.cartel .cg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag.ag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.flag{font-size:1rem;line-height:1}
.st{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.st-conf{color:var(--bad)} .st-canc{color:var(--warn)}
.st-agot{color:var(--warn)}
.st-camb{color:var(--info)}
ol.hist{list-style:none;margin:6px 0 4px;padding:0 0 0 14px;border-left:2px solid var(--line)}
ol.hist li{position:relative;display:flex;gap:10px;padding:5px 0;font-size:.9rem}
ol.hist li::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
ol.hist li:first-child::before{border-color:var(--info);background:var(--info)}
ol.hist time{flex:0 0 66px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
ol.hist s{color:var(--muted)}
.sala-h h2{margin:2px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin:5px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.srow small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.srow .lbtn{min-height:38px;flex:0 0 auto}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.sbox{display:block;margin:10px 0}
.sbox input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--panel);color:var(--ink);font-size:1rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.susc{display:grid;gap:8px}
.salasb{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.salasb small{color:var(--muted);font-weight:500}
/* ficha: foto del artista ↔ cartel de la gira, deslizando (una sola cabecera) */
.carr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;scrollbar-width:none;border-radius:16px}
.carr::-webkit-scrollbar{display:none}
.carr>.hero{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots button{width:22px;height:22px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.dots button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots button[aria-current="true"]::after{background:var(--ink)}
.chev{color:var(--muted);font-size:1.3rem}
/* ficha */
.back{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;text-decoration:none;font-weight:600}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:4/3;max-height:420px;width:100%}
.hero img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:contain;display:block;background:var(--panel2);opacity:0;transition:opacity .15s}
.hero img.ok,.hero img.ya{opacity:1;transition:none}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--gc,var(--c-sin)),color-mix(in srgb,var(--gc,var(--c-sin)) 45%,#000))}
.credit{font-size:.72rem;color:var(--muted);margin-top:4px}
.dt h2{font-size:1.55rem;margin:12px 0 2px;line-height:1.15}
.dt .ciclo{color:var(--muted);font-size:.9rem}
.dt .inv{color:var(--muted);margin-top:2px}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.row{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{flex:0 0 24px;font-size:1.15rem;line-height:1.4;text-align:center}
.row .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.row .v{font-weight:650}
.row .s{font-size:.8rem;color:var(--muted);margin-top:1px}
.box{border-radius:12px;padding:10px 12px;margin:10px 0;border:1px solid}
.box-ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.box-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.box-warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.box ul{margin:6px 0 0;padding-left:20px}
.vers{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.vers div{display:flex;gap:8px;align-items:baseline}
.vers b{font-variant-numeric:tabular-nums;min-width:52px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.actions .primary{grid-column:1/-1}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);font-size:.92rem;font-weight:600}
.lbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.links .lbtn{min-height:40px;font-weight:500}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--c-blues);outline-offset:2px;border-radius:6px}
h3.sec{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 4px}
details.more{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.more summary{cursor:pointer;font-weight:600}
details.more ul{padding-left:20px;margin:8px 0}
/* panel de filtros */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;display:flex;flex-direction:column;background:var(--bg);z-index:21;border-radius:18px 18px 0 0;max-width:720px;margin:0 auto}
.sheet .sc{overflow:auto;padding:14px 16px 8px}
.sheet .ft{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .ft button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.sheet .ft .go{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:2}
.sheet .ft #sdef:disabled{opacity:.5;cursor:default}
.sheet h3{margin:0 0 4px}
.sheet h4{margin:16px 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 8px;text-align:left}
.opts button[aria-pressed="true"]{border-color:var(--ink);font-weight:700;background:var(--ink);color:var(--bg)}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:6px 0}
.grp label{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.grp input{width:20px;height:20px;accent-color:var(--ink)}
.grp .dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.grp .nm{flex:1;font-weight:600}
.grp .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.grp .ct{color:var(--muted);font-size:.85rem}
.grp details{padding:0 12px 10px}
.grp summary{cursor:pointer;color:var(--info);font-size:.82rem}
.estw{padding:0 12px 10px}
.vest{border:0;background:none;color:var(--info);padding:4px 0;font-size:.85rem;min-height:32px}
.vest[aria-expanded="true"]{font-weight:700}
.solo{font-size:.8rem;color:var(--ink);font-weight:600;margin-left:8px}
.shd{display:flex;align-items:center;justify-content:space-between}
.sx{border:0;background:none;font-size:1.3rem;min-width:44px;min-height:44px;color:var(--muted)}
.rapidos{display:flex;gap:6px;margin:0 0 4px}
/* hoja de filtros: géneros como chips que se ajustan en filas; preajuste como control segmentado */
.segp{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel2);border-radius:12px;padding:3px;gap:3px;margin:0 0 10px}
.segp button{border:0;background:none;border-radius:9px;min-height:36px;font-size:.86rem;font-weight:600;color:var(--muted)}
.segp button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.segp button:disabled{opacity:1;cursor:default}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
/* título de sección con lo elegido a la derecha ("Géneros · habituales") */
.sheet h4.sech{display:flex;align-items:baseline;gap:8px}
.sheet h4.sech span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:.8rem}
.gchips .sub{width:100%;font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 0}
.lnk{border:0;background:none;color:var(--info);padding:6px 0;font-size:.85rem;min-height:32px}
.navrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;text-align:left;min-height:48px}
.navrow b{flex:0 0 auto}
.navrow span{flex:1;min-width:0;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navrow::after{content:"›";font-size:1.3rem;color:var(--muted)}
.estsec{margin:6px 0 14px}
.estsec .chips2{display:flex;flex-wrap:wrap;gap:6px}
.estsec h4{display:flex;align-items:center;gap:8px}
.estsec h4 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.estsec[hidden],.estsec .chip[hidden],h4.otros[hidden],.lnk[hidden]{display:none}
.estacc{margin:-2px 0 6px;font-size:.85rem}
.estacc .sw{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 2px}
.estacc .sw input{width:20px;height:20px;accent-color:var(--ink);flex:0 0 auto}
.sback{border:0;background:none;color:var(--info);font-size:.95rem;padding:6px 0;min-height:40px}
.qact{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--c-trib) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c-trib) 40%,var(--line));border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.88rem}
.qact button{flex:0 0 auto;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700;padding:0 10px}
.rapidos button{flex:1;min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.85rem}
.grp .inc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.grp .inc span{font-size:.75rem;background:var(--panel2);border-radius:6px;padding:1px 6px}
.grp .inc span.has{outline:1px solid var(--ok)}
.grp .inc[hidden]{display:none}
.grp .inc .est{min-height:32px;font-size:.8rem;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 9px;color:var(--ink)}
.grp .inc .est:disabled{opacity:.45}
.grp .inc .est.has{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.grp .inc .est.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.hint{color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.viejo{color:var(--c-trib);font-weight:600}
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:10px;margin:10px 0}
.skel-bar{height:40px}.skel-card{height:72px}.skel-hero{height:200px}.skel-l{height:28px;width:70%}.skel-m{height:48px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:1.4rem}
.fu{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.fuh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fun{font-weight:750;color:var(--ink);text-decoration:none;font-size:1rem;line-height:1.25}
.fun::after{content:" ↗";color:var(--muted);font-weight:400;font-size:.8em}
.fus{color:var(--muted);font-size:.8rem;margin:2px 0 8px}
.pill{flex:0 0 auto;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid}
.p-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.p-warn{color:color-mix(in srgb,var(--warn) 88%,var(--ink));border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--panel))}
.p-err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.p-sin{color:var(--muted);border-color:var(--line)}
.fsal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;max-width:330px;margin:0 0 10px}
.fsal i{height:14px;border-radius:3px;background:var(--panel2)}
.fsal i.ok{background:var(--ok)} .fsal i.warn{background:var(--warn)} .fsal i.err{background:var(--bad)}
.fmets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.fm{background:var(--panel2);border-radius:10px;padding:6px 8px;min-width:0}
.fm b{display:block;font-size:1.05rem}
.fm span{display:block;font-size:.72rem;color:var(--muted);line-height:1.2}
.fud{margin-top:8px;font-size:.85rem}
.fud summary{cursor:pointer;color:var(--muted)}
.fud p,.fud ul{margin:6px 0 0}
.fuchips .cnt{font-weight:400;color:var(--muted)} .fuchips [aria-pressed="true"] .cnt{color:var(--bg)}
.fusq{margin:4px 0 12px}
.fsin{list-style:none;padding:0;margin:6px 0 10px}
.fsin li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fsin li small{display:block;color:var(--muted);font-size:.78rem}
.fsin em{font-style:normal;font-weight:700;color:var(--muted)}
.kpi span{color:var(--muted);font-size:.8rem}
.s-ok{color:var(--ok);font-weight:700} .s-err{color:var(--bad);font-weight:700} .s-warn{color:var(--warn);font-weight:700}
.genre{margin:14px 0}
.genre h3{margin:0 0 6px}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.style{font-size:.84rem;border:1px solid var(--line);border-radius:8px;padding:3px 8px;text-decoration:none;color:var(--muted);background:var(--panel)}
.style.has{border-color:var(--ok);color:var(--ok);font-weight:700;background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.md h1,.md h2{font-size:1.1rem;margin:18px 0 6px} .md h3{font-size:1rem;margin:14px 0 4px}
.md ul{padding-left:20px} .md code{background:var(--panel2);padding:1px 4px;border-radius:4px}
.muted{color:var(--muted)}
@media (min-width:700px){.day{min-height:78px}.actions{grid-template-columns:repeat(3,1fr)}.actions .primary{grid-column:auto}}
</style>

<div id="sheet"></div>
<script>
"use strict";
// ---------------------------------------------------------------- grupos (agrupaciones de estilos de Discogs)
const GRUPOS = [
  {id:"rock y metal", nombre:"Rock y metal", v:"--c-rock", desc:"Hard rock, heavy metal, AOR, prog, stoner, psicodelia, grunge, rock clásico y alternativo…"},
  {id:"punk y garage", nombre:"Punk y garage", v:"--c-punk", desc:"Punk, hardcore, garage, post-punk, rock & roll, rockabilly, surf…"},
  {id:"pop e indie", nombre:"Indie y pop-rock", v:"--c-pop", desc:"Indie rock, indie pop, pop rock, power pop, shoegaze, new wave… (el pop comercial y el latino tienen su propio grupo)"},
  {id:"americana/country/folk", nombre:"Americana y folk", v:"--c-amer", desc:"Country, country rock, folk, folk rock, southern rock, bluegrass…"},
  {id:"blues", nombre:"Blues", v:"--c-blues", desc:"Todos los estilos de blues y el blues rock."},
  {id:"synth y dark wave", nombre:"Synthwave y dark wave", v:"--c-synth", desc:"Synthwave y neo synthwave (retrowave, outrun, darksynth…), darkwave, coldwave, synth-pop, EBM, italo-disco… (el resto de la electrónica va a Electrónica)"},
  {id:"cantautor", nombre:"Cantautores", v:"--c-cant", desc:"Solo por la etiqueta de la agenda (Discogs no tiene este estilo)."},
  {id:"tributos y versiones", nombre:"Tributos", v:"--c-trib", desc:"Bandas tributo y de versiones (por la agenda o el título)."},
  {id:"sin clasificar", nombre:"Sin clasificar", v:"--c-sin", desc:"Ni las webs de música ni la agenda dan estilo. Se muestran para no perder conciertos."},
  {id:"jazz y swing", nombre:"Jazz y swing", v:"--c-jazz", desc:"Swing, bebop, hard bop, jazz vocal, latin jazz, fusión, big band, gypsy jazz…", mas:true},
  {id:"soul, funk y r&b", nombre:"Soul, funk y R&B", v:"--c-soul", desc:"Soul, funk, R&B, gospel, disco, neo soul, afrobeat…", mas:true},
  {id:"flamenco y copla", nombre:"Flamenco y copla", v:"--c-flam", desc:"Flamenco, cante y baile, rumba, copla.", mas:true},
  {id:"urbana y hip hop", nombre:"Urbana y hip hop", v:"--c-urb", desc:"Hip hop, rap, trap, reguetón, drill, grime…", mas:true},
  {id:"latina", nombre:"Latina", v:"--c-lat", desc:"Salsa, cumbia, bachata, son, bolero, tango, bossa nova, pop latino…", mas:true},
  {id:"electrónica", nombre:"Electrónica", v:"--c-elec", desc:"Techno, house, trance, drum and bass, ambient, sesiones de DJ… (synthwave y dark wave tienen su grupo)", mas:true},
  {id:"clásica y lírica", nombre:"Clásica y lírica", v:"--c-clas", desc:"Música clásica, ópera, zarzuela, música de cámara, bandas sonoras, conciertos Candlelight…", mas:true},
  {id:"reggae", nombre:"Reggae y dub", v:"--c-reg", desc:"Reggae, roots, dub, dancehall, rocksteady…", mas:true},
  {id:"músicas del mundo", nombre:"Músicas del mundo", v:"--c-world", desc:"Fado, música africana, mestizaje y fusión, músicas tradicionales…", mas:true},
  {id:"pop comercial", nombre:"Pop comercial", v:"--c-popc", desc:"Pop de radiofórmula, baladas, canción melódica, europop, K-pop…", mas:true},
  {id:"musicales y espectáculos", nombre:"Musicales y espectáculos", v:"--c-esc", desc:"Teatro musical, danza, humor y otros espectáculos que no son conciertos.", mas:true},
  {id:"fuera de foco", nombre:"Otros", v:"--c-fuera", desc:"Lo que no es de ningún género: infantil, karaoke, tardeo…", mas:true}];
const GV = Object.fromEntries(GRUPOS.map(g=>[g.id,g.v]));
const GN = Object.fromEntries(GRUPOS.map(g=>[g.id,g.nombre]));
// por defecto, los géneros de siempre; el resto ("Más géneros") se añade desde los filtros
const DEF_GRUPOS = GRUPOS.filter(g=>!g.mas).map(g=>g.id);
const VISTAS = ["Mes","Semana","Día"];
const INFO = ["Salas","Calendarios","Estilos","Fuentes","Informe","Versiones"];
const TABS = [...VISTAS,...INFO];
const ORIGENES = [["todos","Todos"],["es","🇪🇸 España"],["esc","🇪🇸 España (solo confirmados)"],["lat","🌎 Latinoamérica"],["ext","🌍 Resto del mundo"],["nc","Origen sin confirmar"]];
// Latinoamérica tiene grupo propio: un nombre en español no distingue España de Latinoamérica, y así se ve aparte
const LATAM = new Set(["AR","BO","BR","CL","CO","CR","CU","DO","EC","SV","GT","HN","MX","NI","PA","PY","PE","PR","UY","VE"]);
// un mismo criterio para la agenda y para la hoja de filtros
function origenDe(r, o){
  const n=r.nacionalidad;
  if(o==="es") return n==="ES"||(!n&&r.nacionalidad_estimada==="ES");
  if(o==="esc") return n==="ES";
  if(o==="lat") return !!n&&LATAM.has(n);
  if(o==="ext") return !!n&&n!=="ES"&&!LATAM.has(n);
  if(o==="nc") return !n&&!r.nacionalidad_estimada&&!r.origen_no_aplica;
  return true;
}
const store = {
  get(k,d){try{const v=localStorage.getItem("agenda:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("agenda:"+k,JSON.stringify(v))}catch(e){}}
};
let DATA=[], BYID={}, INFORME=null, TAXO=null, SALAS={}, MAP=null, HOY=null, DETALLES=null, SALASJ=null;
// selección guardada con la lista de grupos anterior: se conserva y se añaden los grupos nuevos
// 2.22: lo que antes era "Otros géneros" (fuera de foco) se reparte en grupos propios. Quien tenía elegido
// "Otros géneros" sigue viéndolo todo (se le añaden los grupos nuevos)
const NUEVOS_22=GRUPOS.filter(g=>g.mas).map(g=>g.id);
const gruposGuardados=()=>{const g4=store.get("grupos4",null); if(g4) return g4;
  const g3=store.get("grupos3",null); if(g3) return g3.includes("fuera de foco")?[...new Set([...g3,...NUEVOS_22])]:g3;
  const g2=store.get("grupos2",null); return g2?[...g2,...DEF_GRUPOS.filter(g=>!["rock y metal","punk y garage","pop e indie","americana/country/folk","blues","cantautor","tributos y versiones","sin clasificar"].includes(g))]:DEF_GRUPOS;};
let state = {tab:"Mes", date:null, id:null, q:"", grupos:gruposGuardados(), origen:store.get("origen","todos"), from:null,
  estilos:store.get("estilos",{}), genericos:store.get("genericos",true)};
let regionNames=null; try{regionNames=new Intl.DisplayNames(["es"],{type:"region"})}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>parse(s).toLocaleDateString("es-ES",o);
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const flag=c=>/^[A-Z]{2}$/.test(c||"")?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):"";
const pais=c=>{if(!c)return "";try{return regionNames?regionNames.of(c):c}catch(e){return c}};
const iniciales=n=>esc(String(n||"?").replace(/^(the|los|las|la|el)\s+/i,"").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase());
const grupos=r=>r._g||(r._g=(r.grupos&&r.grupos.length?r.grupos:[r.categoria]));
const estilosDe=r=>r._e||(r._e=new Set(r.estilos_discogs||[]));
// para filtrar: los grupos del concierto y los de los artistas de su cartel (un telonero punk hace que el concierto
// salga también al filtrar por punk; la tarjeta lo dice)
const gruposF=r=>r._gf||(r._gf=[...grupos(r),...Object.keys(r.grupos_cartel||{}).filter(g=>!grupos(r).includes(g))]);
const color=r=>GV[grupos(r)[0]]||"--c-sin";
const img=r=>r.imagen&&r.imagen.url?r.imagen:(r.img?{url:r.img}:null);
// Las fotos de las agendas son carteles a tamaño completo (hasta 1-2 MB) en servidores lentos: para una miniatura
// de 60 px se pide una copia reducida. Wikimedia ya da tamaños fijos; el resto pasa por wsrv.nl (CDN gratuita
// que redimensiona y guarda la copia). Si falla, se usa la original y, si no, las iniciales.
function fotoUrl(u,w,cuadrada){
  if(!u) return "";
  const m=u.match(/^(https:\/\/(?:thumb|upload)\.wikimedia\.org\/.+\/)(\d+)px-([^/]+)$/);
  if(m) return m[1]+(w<=120?120:w<=250?250:500)+"px-"+m[3];
  if(/commons\.wikimedia\.org\/wiki\/Special:FilePath/.test(u)) return u.replace(/width=\d+/,"width="+w);
  // Fever redimensiona en su propia CDN; conciertos.club y Discogs no dejan pasar a wsrv.nl (comprobado en la
  // prueba en vivo): se piden tal cual (conciertos.club tiene miniatura propia, ver tools/miniaturas.py)
  if(/feverup\.com\/image\/upload\//.test(u)) return u.replace(/w_\d+,h_\d+/,`w_${w},h_${w}`);
  if(/^https:\/\/([a-z]+\.)?(conciertos\.club|discogs\.com)\//.test(u)) return u;
  return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=${w}${cuadrada?`&h=${w}&fit=cover&a=attention`:""}&output=webp&q=${cuadrada?70:78}&we`;

function textoDe(r){return norm([r.artista,(r.invitados||[]).join(" "),r.sala,r.municipio,r.ciclo,(r.estilos_discogs||[]).join(" "),(r.genero_discogs||[]).join(" ")].join(" "));}
function pasaTexto(r,q=state.q){
  if(!q.trim()) return true;
  const hay=r._t||(r._t=textoDe(r));
  return norm(q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
// "Borrar filtros" deja todo como al entrar: géneros de siempre, cualquier origen, sin estilos y sin búsqueda
function borrarFiltros(){
  setGrupos([...DEF_GRUPOS]); state.origen="todos"; store.set("origen","todos"); state.estilos={}; store.set("estilos",{});
  state.genericos=true; store.set("genericos",true); state.q=""; renderBody(false);
}
function pasaOrigen(r){
  if(state.origen!=="todos") return origenDe(r,state.origen);
  return true;
}
// Un concierto pasa si está en un género elegido; si en ese género se han elegido estilos concretos, además
// tiene que tener alguno (según las webs de música). Los clasificados solo por una etiqueta genérica de la
// agenda ("Pop / Rock") se pueden excluir.
function pasaGrupo(r){
  if(r.grupos_generico&&!state.genericos) return false;
  const gs=gruposF(r);
  return state.grupos.some(g=>gs.includes(g)&&(!(state.estilos[g]||[]).length||state.estilos[g].some(s=>estilosDe(r).has(s))));
}
function visible(r){ return pasaGrupo(r) && pasaTexto(r) && pasaOrigen(r); }
function byDate(){const m={}; for(const r of DATA){ if(!visible(r)) continue; (m[r.fecha]=m[r.fecha]||[]).push(r);} return m;}
const nEstilos=()=>Object.values(state.estilos).reduce((n,l)=>n+(l||[]).length,0);
const esDefecto=()=>DEF_GRUPOS.every(g=>state.grupos.includes(g))&&!NUEVOS_22.some(g=>state.grupos.includes(g))&&!nEstilos()&&state.genericos;
function nFiltros(){ return (esDefecto()?0:1)+(state.origen!=="todos"?1:0)+(state.q.trim()?1:0); }
function resumenFiltros(){
  const p=[];
  if(!esDefecto()){
    if(GRUPOS.every(g=>state.grupos.includes(g.id))) p.push("todos los géneros");
    else if(!state.grupos.length) p.push("ningún género");
    else p.push(GRUPOS.filter(g=>state.grupos.includes(g.id)).map(g=>g.nombre+((state.estilos[g.id]||[]).length?` (${state.estilos[g.id].join(", ")})`:"")).join(", "));
    if(!state.genericos) p.push("sin etiquetas genéricas");
  }
  if(state.origen!=="todos") p.push((ORIGENES.find(o=>o[0]===state.origen)||["",""])[1].replace(/^\S+ /,""));
  if(state.q.trim()) p.unshift(`búsqueda «${state.q.trim()}»`);
  return p.join(" · ");
}
function filtersHTML(){
  const n=nFiltros();
  return `<div class="bar"><div class="sbox"><input class="search" id="q" type="search" enterkeyhint="search" placeholder="Buscar artista, sala o estilo" value="${esc(state.q)}" aria-label="Buscar en todas las fechas">${state.q?`<button class="sclear" id="qx" aria-label="Borrar búsqueda">✕</button>`:""}</div>

// pastillas de género y resumen de filtros: se rehacen en cada tecla de la búsqueda (sin tocar el cuadro de texto)
function extraHTML(){
  const n=nFiltros();

  const modo=modoGrupos(state.grupos);

    // los elegidos, delante (si no, al tocar uno que está a la derecha la fila vuelve al principio y no se ve)
    [...GRUPOS].sort((x,y)=>(modo==="custom")*((state.grupos.includes(y.id))-(state.grupos.includes(x.id)))).map(g=>`<button class="chip" data-chip="${esc(g.id)}" aria-pressed="${modo==="custom"&&state.grupos.includes(g.id)}"><i style="background:var(${g.v})"></i>${esc(g.nombre)}<small class="cc">${cn[g.id]||0}</small></button>`).join("");

// preajuste de géneros: los habituales, todos, o una selección propia
function modoGrupos(sel){
  const mismo=(a,b)=>a.length===b.length&&b.every(x=>a.includes(x));
  return mismo(sel,DEF_GRUPOS)?"def":mismo(sel,GRUPOS.map(g=>g.id))?"todos":"custom";

function grupoDeEstilo(s){
  if(!MAP||!TAXO) return null;
  for(const [g,l] of Object.entries(MAP.discogs_a_categoria)) if(Array.isArray(l)&&l.includes(s)) return g;
  for(const [gen,l] of Object.entries(TAXO.generos)) if(l.includes(s)) return MAP.genero_a_categoria[gen]||"fuera de foco";
  return "fuera de foco";
}
function todosLosEstilos(){
  if(!TAXO||!MAP) return [];
  const out=new Set();
  Object.values(TAXO.generos).forEach(l=>l.forEach(x=>out.add(x)));
  Object.values(MAP.discogs_a_categoria).forEach(l=>Array.isArray(l)&&l.forEach(x=>out.add(x)));
  return [...out];
}
function openSheet(){
  // Hoja de filtros. Se pinta una vez; cada toque solo cambia lo que toca (casilla, estilo, contador), sin volver a
  // construir la hoja entera. Los grupos y estilos de cada concierto están precalculados (r._g, r._e).
  const ARBOL={}; todosLosEstilos().forEach(s=>{const g=grupoDeEstilo(s); (ARBOL[g]=ARBOL[g]||[]).push(s);});
  let sel=[...state.grupos], ori=state.origen, selEst=JSON.parse(JSON.stringify(state.estilos||{})), genOk=state.genericos, q=state.q;

    for(const r of fut){ for(const g of gruposF(r)){cnt[g]=(cnt[g]||0)+1; if(r.grupos_generico) gen[g]=(gen[g]||0)+1;}
      for(const s of r.estilos_discogs||[]){const g=grupoDeEstilo(s); if(!g) continue; (est[g]=est[g]||{})[s]=(est[g][s]||0)+1;}} };

  const total=()=>fut.reduce((n,r)=>n+(pasa(r)?1:0),0);

     <button type="button" class="navrow" id="vestilos"><b>Afinar por estilos</b><span id="resest">${esc(resumenTodos())}</span></button>`;};

// ---------------------------------------------------------------- tarjeta (lista)
function horaCard(r){
  if(r.hora) return r.hora;
  const c=(r.conflictos||[]).find(c=>c.campo==="hora"&&c.versiones&&c.versiones.length);
  return c?[...c.versiones].sort((a,b)=>b.fuentes.length-a.fuentes.length)[0].valor+" ?":"";
}
function horaTxt(r){ return r.hora||(r.conflictos||[]).filter(c=>c.campo==="hora").map(c=>c.versiones.map(v=>v.valor).join(" ó ")).join("")||""; }
function etiquetaAgenda(r){
  // la etiqueta de la agenda a veces es el nombre de un ciclo o de la sala ("Villanos del Jazz"): no es un estilo
  const salaTok=norm(r.sala).split(/[^a-z0-9]+/).filter(t=>t.length>=4&&!["sala","club","teatro","madrid"].includes(t));
  return (r.estilo_fuente||[]).map(e=>e.estilo).find(e=>{const n=norm(e); return !(r.ciclo&&n.includes(norm(r.ciclo)))&&!salaTok.some(t=>n.includes(t))&&!/^otros?$/.test(n);});
}
function estiloTags(r,n){
  const e=(r.estilos_discogs||[]).slice(0,n);
  if(e.length) return e.map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  if((r.genero_discogs||[]).length) return r.genero_discogs.slice(0,n).map(s=>`<span class="tag">${esc(s)}</span>`).join("");
  const a=(etiquetaAgenda(r)||"").replace(/_/g," ");
  if(a&&r.grupos_generico) return `<span class="tag ag" title="Etiqueta genérica de la agenda: no se sabe el estilo concreto">${esc(a)} · genérico</span>`;
  return a?`<span class="tag ag" title="Etiqueta de la agenda, no de una web de música">${esc(a)}</span>`:"";
}
function estadoMini(r){
  const ev=r.evento||(r.estado_evento||{}).tipo;
  if(ev) return `<span class="st st-conf">${esc(ev)}</span>`;
  if(r.agotado) return `<span class="st st-agot">agotado</span>`;
  if(r.estado==="conflicto"){
    const campos=[...new Set((r.conflictos||[]).map(c=>({hora:"hora",sala:"sala",cartel:"cartel"})[c.campo]).filter(Boolean))];
    return `<span class="st st-conf" title="Las webs no coinciden: abre el concierto para ver cada versión">⚠ ${campos.length?esc(campos.join(" y "))+" sin confirmar":"datos distintos"}</span>`;
  }
  if(r.estado==="posiblemente cancelado") return `<span class="st st-canc">¿cancelado?</span>`;
  return "";
}
// festival en la tarjeta: los primeros artistas del cartel y cuántos más
function cartelCorto(r){
  const l=r.invitados||[], n=l.length, v=l.slice(0,4).join(" · ");
  return n>4?`${v} y ${n-4} más`:r.cartel_incompleto?`${v} y más`:v;
}
// géneros que aporta el cartel (no los del cabeza): "+ Punk y garage", con quién en el título
function cartelTags(r){
  const gc=r.grupos_cartel||{};

    `<span class="tag tcart" title="${esc(gc[g].join(", "))} (${r.festival?"en el cartel":"telonero o invitado"})">+ ${esc(GN[g])}</span>`).join("");

function card(r){

   ${r.invitados&&r.invitados.length?`<div class="sub">${r.festival?`${esc(cartelCorto(r))}`:`+ ${r.invitados.map(esc).join(" + ")}`}</div>`:""}
   <div class="sub">${h?`<b>${esc(h)}</b> · `:""}${esc(r.sala||"sala sin indicar")}${r.municipio&&r.municipio!=="Madrid"?` · ${esc(r.municipio)}`:""}</div>
   <div class="tags">${r.nacionalidad?`<span class="flag" title="${esc(pais(r.nacionalidad))}">${flag(r.nacionalidad)}</span>`:r.nacionalidad_estimada?`<span class="flag est" title="Probablemente ${esc(pais(r.nacionalidad_estimada))} (estimado por el nombre)">${flag(r.nacionalidad_estimada)}</span>`:""}${estiloTags(r,2)}${cartelTags(r)}${estadoMini(r)}${cambioMini(r)}</div></div><span class="chev" aria-hidden="true">›</span></a>`;

  // las primeras miniaturas de la vista se piden ya y con prioridad; el resto, al acercarse

  return r._conImg?r._card.replace("%SRC%",nImg++<6?'fetchpriority="high" src':`src="${PIXEL}" data-src`):r._card;

// estado vacío que dice por qué: sin conciertos anunciados, o todos ocultos por los filtros (con un botón)
function vacioHTML(ocultos,cuando){

const mayus=t=>t.charAt(0).toUpperCase()+t.slice(1);
function dayHead(fecha,n,cls){ const rel=fecha===HOY?"Hoy, ":fecha===addDays(HOY,1)?"Mañana, ":"", t=fmt(fecha,{weekday:"long",day:"numeric",month:"long"});

// ---------------------------------------------------------------- ficha detallada
function icsDe(r){
  const d=r.fecha.replace(/-/g,""), h=(r.hora||"").replace(":","");
  const ini=h?`DTSTART;TZID=Europe/Madrid:${d}T${h}00`:`DTSTART;VALUE=DATE:${d}`;
  const fin=h?`DURATION:PT3H`:`DTEND;VALUE=DATE:${addDays(r.fecha,1).replace(/-/g,"")}`;
  const t=s=>String(s||"").replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//agenda-conciertos//ES","BEGIN:VEVENT",`UID:${r.id}@agenda-conciertos`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,ini,fin,`SUMMARY:${t(r.artista)}`,
    `LOCATION:${t((r.sala||"")+", "+(r.municipio||"Madrid"))}`,`URL:${location.href.split("#")[0]}#concierto/${r.id}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function descargarIcs(r){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([icsDe(r)],{type:"text/calendar"}));
  a.download=`${norm(r.artista).replace(/[^a-z0-9]+/g,"-").slice(0,40)||"concierto"}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function compartir(r){
  const url=`${location.href.split("#")[0]}#concierto/${r.id}`;
  const text=`${r.artista} · ${fmt(r.fecha,{weekday:"short",day:"numeric",month:"short"})}${r.hora?" "+r.hora:""} · ${r.sala}`;
  try{ if(navigator.share){ await navigator.share({title:r.artista,text,url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(`${text}\n${url}`); toast("Enlace copiado"); }catch(e){ prompt("Copia el enlace:",url); }
}
// cancelado / aplazado / agotado, según la página del concierto o de las entradas (se dice cuál)
function avisoEvento(r){
  const ev=r.estado_evento||(r.evento?{tipo:r.evento}:null), ag=typeof r.agotado==="object"?r.agotado:(r.agotado?{}:null);
  const de=x=>x&&x.url?` según <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nombre)}</a>`:"";
  if(ev) return `<div class="box ${ev.tipo==="cancelado"?"box-bad":"box-warn"}"><b>${ev.tipo==="cancelado"?"Cancelado":"Aplazado"}</b>${de(ev)}. Confírmalo antes de ir.</div>`;
  if(ag) return `<div class="box box-warn"><b>Entradas agotadas</b>${de(ag)}.</div>`;
  return "";
}
function estadoBox(r){ return avisoEvento(r)+estadoBox0(r); }
function estadoBox0(r){
  if(!r._full) return `<div class="box" id="cargando">Cargando fuentes, precio y enlaces…</div>`;
  const conflictos=(r.conflictos||[]).filter(c=>c.versiones&&c.versiones.length);

    const nom={hora:"Hora",sala:"Sala",cartel:"Cartel"};
    const items=conflictos.map(c=>{
      const vs=[...c.versiones].sort((a,b)=>b.fuentes.length-a.fuentes.length);
      const horas=c.campo==="hora"?vs.map(v=>v.valor).sort():[];
      return `<div><b>${esc(nom[c.campo]||c.campo)}</b></div><div class="vers">${vs.map(v=>`<div><b>${esc(v.valor)}</b><span class="muted">${plural(v.fuentes.length,"web")}: ${esc(v.fuentes.map(x=>x.split(" (")[0]).filter((x,i,a)=>a.indexOf(x)===i).join(", "))}</span></div>`).join("")}</div>
        ${c.campo==="hora"&&horas.length>1?`<div class="hint" style="margin-top:4px">Si una hora es bastante anterior, suele ser la apertura de puertas. Confírmalo en la web de la sala o de las entradas.</div>`:""}`;
    }).join("");
    const man=(r.notas||[]).filter(n=>/Corrección manual/.test(n)).map(n=>`<div class="hint">${esc(n)}</div>`).join("");
    return `<div class="box box-bad"><b>⚠ Las webs no coinciden</b>${items}${man}</div>`;
  }
  if(r.estado==="posiblemente cancelado")
    return `<div class="box box-warn"><b>¿Cancelado?</b> Ya no aparece en ninguna de las webs donde se anunciaba. Visto por última vez el ${esc(r.ultima_vez_visto||"—")}.</div>`;
  if(r.confirmado_sala)
    return `<div class="box box-ok">✓ Confirmado en la web oficial de la sala${r.fuentes.length>1?` y en ${plural(r.fuentes.length-1,"web")} más`:""}.</div>`;
  const n=new Set(r.fuentes.map(x=>x.nombre.split(" (")[0])).size;
  if(n>1) return `<div class="box box-ok">✓ Anunciado en ${n} webs distintas.</div>`;
  const baja=(r.notas||[]).some(n=>/fiabilidad baja/i.test(n));
  return `<div class="box ${baja?"box-warn":"box-ok"}">${baja?"Solo aparece en una web poco fiable: conviene confirmarlo.":`Anunciado solo en ${esc(r.fuentes[0].nombre.split(" (")[0])}.`}</div>`;
}

      (ag?`<div class="s">La agenda lo etiqueta como «${esc(ag.replace(/_/g," "))}»${r.grupos_generico?" (etiqueta genérica: puede ser cualquiera de estos géneros)":""} → ${esc(gruposTxt)}</div>`:`<div class="s">Género: ${esc(gruposTxt)}</div>`)+
      ((r.estilo_descartado||[]).length?`<div class="s">Last.fm tiene un artista con este nombre (${esc(r.estilo_descartado.join(", "))}), pero no concuerda con la agenda: puede ser otro artista y no se usa.</div>`:"");

function viewMes(){

function mdToHtml(md){
  const lines=md.split("\n"); let out="", inList=false;
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2">$1</a>');
  for(const l of lines){
    if(/^\s*[-*] /.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`; continue; }
    if(inList){out+="</ul>";inList=false;}
    const h=l.match(/^(#{1,3}) (.*)/); if(h){out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue;}
    if(l.trim()) out+=`<p>${inline(l)}</p>`;
  }
  return out+(inList?"</ul>":"");
}

  if(sw&&!state.q.trim()){ let x0=null,y0=null; const paso=state.tab==="Semana"?7:1;
    sw.ontouchstart=e=>{x0=e.touches[0].clientX; y0=e.touches[0].clientY;};
    sw.ontouchend=e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)) navegar(dx<0?paso:-paso); };
  }
}
function render(){ document.getElementById("hdr").classList.remove("buscando"); document.getElementById("sheet").innerHTML=""; document.getElementById("menu").innerHTML=""; renderTabs(); renderBody(false); }

async function load(){
  const j=async u=>{const r=await fetch(u,{cache:"no-cache"}); if(!r.ok) throw new Error(u); return r.json();};
  // agenda ligera; si no está (copia antigua de la web), el archivo completo
  const agenda=()=>j("data/agenda.json").catch(()=>j("data/concerts.json"));
  try{
    const [c,inf,tax,sal,map]=await Promise.all([agenda(),j("data/informe.json").catch(()=>null),j("data/taxonomia.json").catch(()=>null),j("data/salas_alias.json").catch(()=>null),j("data/estilos_map.json").catch(()=>null)]);
    DATA=c.conciertos||[]; DETALLES=c.detalles||null; INFORME=inf; TAXO=tax; MAP=map; HOY=iso(new Date());
    DATA.forEach(r=>{BYID[r.id]=r; if(!DETALLES) r._full=true;});
    if(sal) sal.salas.forEach(s=>{SALAS[norm(s.nombre)]=s;});
    const horas=(Date.now()-new Date(c.generado))/36e5;
    const u=document.getElementById("upd");
    u.textContent=`${DATA.filter(r=>r.fecha>=HOY).length} conciertos · actualizado ${new Date(c.generado).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`;
    // la actualización diaria no ha llegado (fallo de GitHub, sin conexión y datos guardados…): se avisa
    if(horas>30){ u.textContent+=` · ⚠ datos de hace ${horas<48?Math.round(horas)+" h":Math.round(horas/24)+" días"}`; u.classList.add("viejo"); }
  }catch(e){ document.getElementById("main").innerHTML=`<p class="empty">No se pudieron cargar los datos (${esc(e.message)}). Comprueba la conexión y recarga la página.</p>`; return; }
  state.tab=store.get("tab","Mes"); if(!VISTAS.includes(state.tab)) state.tab="Mes"; state.date=HOY; readHash(); render();
}
document.getElementById("main").addEventListener("pointerdown",tocar,{passive:true});
// Volver deja la lista donde estaba: al salir de una lista se guarda por qué concierto ibas (y a qué altura de la
// pantalla estaba) y, al volver a esa misma lista, se recoloca ahí
const posiciones={}; let tocado=null;
document.getElementById("main").addEventListener("click",e=>{const c=e.target.closest&&e.target.closest(".card"); if(c) tocado={id:c.dataset.id,top:c.getBoundingClientRect().top};},true);
function recolocar(){
  const p=posiciones[location.hash]; if(!p||state.tab==="Concierto") return false;
  const el=p.id&&document.querySelector(`.card[data-id="${CSS.escape(p.id)}"]`);
  if(el){
    el.scrollIntoView({block:"center"});           // primero cerca (las tarjetas de fuera aún no tienen su alto real)
    scrollBy(0,el.getBoundingClientRect().top-(p.top||0));  // y luego a la misma altura de pantalla que tenía
    const q=el.getBoundingClientRect(); if(q.top<0||q.bottom>innerHeight) el.scrollIntoView({block:"center"});
  } else scrollTo(0,p.y);
  return true;
}
addEventListener("hashchange",()=>{
  if(lastHash&&!lastHash.startsWith("#concierto")) posiciones[lastHash]={y:scrollY,...(tocado||{})};
  tocado=null;
  pintarTodo=!!posiciones[location.hash];
  readHash(); render(); pintarTodo=false;
  if(state.tab==="Concierto") scrollTo(0,0); else requestAnimationFrame(()=>{ if(!recolocar()) scrollTo(0,0); });
});
addEventListener("resize",()=>{const h=document.getElementById("hdr"); if(h) document.documentElement.style.setProperty("--hh",h.offsetHeight+"px"); fijas();});
load();
// copia local de la web y de los últimos datos: si la red o GitHub Pages fallan, se sigue viendo la agenda
if("serviceWorker" in navigator&&location.protocol==="https:") addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
