name: Prueba de concepto AllMusic (no forma parte de la agenda)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - name: Probar las alternativas
        env:
          PARSEBOT_KEY: ${{ secrets.PARSEBOT_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ALLAPI_KEY: ${{ secrets.ALLAPI_KEY }}
        run: python tools/poc_allmusic.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f capturas/poc_allmusic
          git commit -m "Prueba AllMusic" || exit 0
          git pull --rebase --autostash
          git push
