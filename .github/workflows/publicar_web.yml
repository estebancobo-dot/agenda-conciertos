name: Publicar la web (sin leer agendas)

# Vuelve a publicar la web con los datos ya guardados en la rama `datos` y el código actual de `main`. Sirve para
# que un cambio de la web llegue en un par de minutos sin esperar a la siguiente lectura de agendas o de fichas.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos para hacer miniaturas nuevas antes de publicar (0: ninguna)"
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer datos (rama datos)
        run: python tools/datos.py
      - name: Miniaturas de la caché antigua (solo para pasar a la rama miniaturas)
        uses: actions/cache/restore@v4
        with:
          path: miniaturas
          key: miniaturas-${{ github.run_id }}
          restore-keys: miniaturas-
      - name: Miniaturas propias nuevas
        continue-on-error: true
        run: python tools/miniaturas.py --guardar --minutos ${{ github.event.inputs.minutos || '5' }}
      - name: Preparar web
        run: |
          mkdir -p _site/data
          cp site/index.html site/sw.js _site/
          cp CHANGELOG.md _site/
          cp data/concerts.json data/informe.json data/taxonomia.json data/estilos_map.json data/salas_alias.json data/concerts.csv _site/data/
          python tools/web_datos.py _site
          touch _site/.nojekyll
      - name: Probar la web antes de publicarla (navegador real con datos fijos)
        # si la web nueva no funciona no se publica: sigue la anterior
        run: |
          pip install playwright && python -m playwright install --with-deps chromium
          python -m pytest -q -rs tests/test_web_navegador.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub no admite dos publicaciones a la vez: si otra estaba en curso, se espera y se reintenta
      - name: Esperar a la publicación en curso
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
