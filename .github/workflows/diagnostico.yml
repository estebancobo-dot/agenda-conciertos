name: Diagnóstico de páginas de agenda

# Lee unas páginas de concierto y escribe en el registro qué dicen del artista (para mejorar la lectura de estilo
# y origen). No guarda ni publica nada.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Páginas por web"
        default: "16"
      webs:
        description: "Solo estas webs (separadas por comas; vacío = todas), 'fuentes', 'entradas', 'cartel', 'huecos', 'mev' (enlace de compra de Madrid en Vivo), 'candidatas', 'probar:ID[,ID]' (lector completo de esas fuentes), 'crudo:URL' (lo que devuelve tal cual; URL@texto, URL@enlaces:patrón, URL@json), 'render:URL' (igual, con un navegador real), o la URL de una página"
        default: ""

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}  # la rama desde la que se lanza (main o una de desarrollo, para probar antes)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/datos.py
      - if: github.event.inputs.webs != 'fuentes' && github.event.inputs.webs != 'entradas' && github.event.inputs.webs != 'cartel' && github.event.inputs.webs != 'huecos' && github.event.inputs.webs != 'mev' && !startsWith(github.event.inputs.webs, 'candidatas') && !startsWith(github.event.inputs.webs, 'probar:') && !startsWith(github.event.inputs.webs, 'crudo:') && !startsWith(github.event.inputs.webs, 'render:') && !startsWith(github.event.inputs.webs, 'http') && github.event.inputs.webs != 'lotes'
        run: python tools/diagnostico_agenda.py ${{ github.event.inputs.n || '16' }} "${{ github.event.inputs.webs }}"
      - if: github.event.inputs.webs == 'fuentes'
        run: python tools/diagnostico_fuentes.py ${{ github.event.inputs.n || '30' }}
      - if: startsWith(github.event.inputs.webs, 'http')
        run: python tools/ver_pagina.py "${{ github.event.inputs.webs }}"
      - if: github.event.inputs.webs == 'entradas'
        run: python tools/diagnostico_entradas.py ${{ github.event.inputs.n || '8' }} 15
      - if: github.event.inputs.webs == 'huecos'
        run: python tools/diagnostico_huecos.py ${{ github.event.inputs.n || '12' }} 16
      - if: github.event.inputs.webs == 'mev'
        run: python tools/diagnostico_mev_entradas.py ${{ github.event.inputs.n || '12' }}
      - if: github.event.inputs.webs == 'cartel'
        run: python tools/diagnostico_cartel.py ${{ github.event.inputs.n || '10' }} 13
      - if: startsWith(github.event.inputs.webs, 'candidatas')
        env:
          WEBS: ${{ github.event.inputs.webs }}
        run: python tools/diagnostico_candidatas.py $(echo "${WEBS#candidatas}" | tr -d ":")
      - if: startsWith(github.event.inputs.webs, 'render:') || startsWith(github.event.inputs.webs, 'probar:')
        run: pip install playwright && python -m playwright install --with-deps chromium
      - if: startsWith(github.event.inputs.webs, 'probar:')
        env:
          WEBS: ${{ github.event.inputs.webs }}
        run: python tools/probar_fuente.py $(echo "${WEBS#probar:}" | tr ',' ' ')
      - if: github.event.inputs.webs == 'lotes'
        run: python tools/probar_lotes.py
      - if: startsWith(github.event.inputs.webs, 'crudo:')
        env:
          WEBS: ${{ github.event.inputs.webs }}
        run: python tools/diagnostico_candidatas.py --crudo $(echo "${WEBS#crudo:}" | tr ',' ' ')
      - if: startsWith(github.event.inputs.webs, 'render:')
        env:
          WEBS: ${{ github.event.inputs.webs }}
        run: python tools/diagnostico_candidatas.py --render $(echo "${WEBS#render:}" | tr ',' ' ')
