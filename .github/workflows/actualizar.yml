name: Actualizar agenda y publicar web

on:
  schedule:
    - cron: "0 5 * * *"      # todos los días a las 05:00 UTC: agendas + fichas
    - cron: "40 */2 * * *"   # cada 2 horas: solo fichas de artista pendientes (termina enseguida si no hay)
  workflow_dispatch:
    inputs:
      fichas:
        description: "Solo fichas de artista (no lee las agendas)"
        type: boolean
        default: false
      solo:
        description: "Solo estas fuentes (ids separados por comas; vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # el último main, no el de cuando se lanzó (puede haber datos más nuevos)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Rastrear fuentes
        # deja margen dentro de las 2 horas del trabajo para guardar lo hecho aunque se corte
        timeout-minutes: 100
        env:
          TZ: Europe/Madrid
          # Claves gratuitas opcionales (Settings → Secrets and variables → Actions). Sin ellas funciona igual.
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 */2 * * *" ] || [ "${{ github.event.inputs.fichas }}" = "true" ]; then
            # cada 2 horas: reintenta las fuentes que fallaron en la última lectura y completa fichas pendientes
            python -m scraper --reintentar || echo "El reintento de fuentes falló; se sigue con las fichas"
            python -m scraper --fichas --minutos 45
          elif [ -n "${{ github.event.inputs.solo }}" ]; then
            python -m scraper --solo "${{ github.event.inputs.solo }}"
          else
            python -m scraper
          fi
      - name: Guardar datos en el repositorio
        id: guardar
        # también si el rastreo falla o se corta: así no se pierden las fichas de artista ya guardadas
        if: always()
        run: |
          # une sus datos con los que otra ejecución haya subido mientras tanto (ver tools/guardar_datos.py)
          python tools/guardar_datos.py
      - name: Preparar web
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp CHANGELOG.md _site/
          cp data/concerts.json data/informe.json data/taxonomia.json data/estilos_map.json data/salas_alias.json data/concerts.csv _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}

  desplegar:
    needs: actualizar
    # las ejecuciones de solo fichas sin nada pendiente no cambian la web: no se vuelve a publicar
    if: needs.actualizar.outputs.cambios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
