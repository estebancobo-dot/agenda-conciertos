name: Actualizar agenda y publicar web

on:
  schedule:
    # todos los días a las 03:10 UTC (05:10 en Madrid en verano, 04:10 en invierno): agendas + fichas. Tarda unos
    # 40 minutos; con el retraso habitual de los cron de GitHub termina antes de las 7 en Madrid todo el año
    - cron: "10 3 * * *"
    # cada 2 horas de 05:40 a 23:40 UTC: reintenta las fuentes que fallaron y completa fichas de artista. No hay
    # pasadas de madrugada para que ninguna retrase la ejecución completa (no se solapan: van en cola)
    - cron: "40 5-23/2 * * *"
  workflow_dispatch:
    inputs:
      fichas:
        description: "Solo fichas de artista (no lee las agendas)"
        type: boolean
        default: false
      solo:
        description: "Solo estas fuentes (ids separados por comas; vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # un issue de aviso cuando alguna fuente lleva días fallando (tools/alertas.py)
  pages: write
  id-token: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # el último main, no el de cuando se lanzó (puede haber datos más nuevos)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer datos (rama datos)
        # los datos generados viven en la rama `datos`; si no se pueden traer, no se rastrea (ver tools/datos.py)
        run: python tools/datos.py
      - name: Tests
        run: python -m pytest -q
      - name: Rastrear fuentes
        # deja margen dentro de las 2 horas del trabajo para guardar lo hecho aunque se corte
        timeout-minutes: 100
        env:
          TZ: Europe/Madrid
          # Claves gratuitas opcionales (Settings → Secrets and variables → Actions). Sin ellas funciona igual.
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 5-23/2 * * *" ] || [ "${{ github.event.inputs.fichas }}" = "true" ]; then
            # cada 2 horas: reintenta las fuentes que fallaron en la última lectura y completa fichas pendientes
            python -m scraper --reintentar || echo "El reintento de fuentes falló; se sigue con las fichas"
            python -m scraper --fichas --minutos 45
          elif [ -n "${{ github.event.inputs.solo }}" ]; then
            python -m scraper --solo "${{ github.event.inputs.solo }}"
          else
            python -m scraper
          fi
      - name: Guardar datos en el repositorio
        id: guardar
        # también si el rastreo falla o se corta: así no se pierden las fichas de artista ya guardadas
        if: always()
        run: |
          # une sus datos con los que otra ejecución haya subido mientras tanto (ver tools/guardar_datos.py)
          python tools/guardar_datos.py
      - name: Avisar de fuentes con problemas
        if: always() && steps.guardar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/alertas.py
      - name: Miniaturas guardadas de otros días
        uses: actions/cache/restore@v4
        with:
          path: miniaturas
          key: miniaturas-${{ github.run_id }}
          restore-keys: miniaturas-
      - name: Miniaturas propias (carteles de conciertos.club)
        # solo las nuevas; con tope de tiempo (lo que falte, mañana). Nunca impide publicar la web
        continue-on-error: true
        timeout-minutes: 12
        run: python tools/miniaturas.py --minutos ${{ github.event.schedule == '10 3 * * *' && '10' || '4' }}
      - name: Guardar miniaturas para otros días
        if: always()
        uses: actions/cache/save@v4
        with:
          path: miniaturas
          key: miniaturas-${{ github.run_id }}
      - name: Preparar web
        run: |
          # la web con el código más reciente de main (esta ejecución pudo empezar antes de un cambio de la web)
          git fetch -q --depth=1 origin main && git checkout FETCH_HEAD -- site CHANGELOG.md tools/web_datos.py
          mkdir -p _site/data
          cp site/index.html site/sw.js _site/
          cp CHANGELOG.md _site/
          cp data/concerts.json data/informe.json data/taxonomia.json data/estilos_map.json data/salas_alias.json data/concerts.csv _site/data/
          # agenda ligera + detalle por días (lo que descarga la web; concerts.json sigue publicándose)
          python tools/web_datos.py _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}

  desplegar:
    needs: actualizar
    # las ejecuciones de solo fichas sin nada pendiente no cambian la web: no se vuelve a publicar
    if: needs.actualizar.outputs.cambios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub no admite dos publicaciones a la vez: si otra estaba en curso, se espera y se reintenta
      - name: Esperar a la publicación en curso
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - id: reintento
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
