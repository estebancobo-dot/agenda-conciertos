name: Actualizar agenda y publicar web

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días a las 05:00 UTC
  workflow_dispatch:
    inputs:
      solo:
        description: "Solo estas fuentes (ids separados por comas; vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Rastrear fuentes
        env:
          TZ: Europe/Madrid
          # Claves gratuitas opcionales (Settings → Secrets and variables → Actions). Sin ellas funciona igual.
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            python -m scraper --solo "${{ github.event.inputs.solo }}"
          else
            python -m scraper
          fi
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos actualizados $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
      - name: Preparar web
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp CHANGELOG.md _site/
          cp data/concerts.json data/informe.json data/taxonomia.json data/estilos_map.json data/salas_alias.json data/concerts.csv _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
    outputs:
      ok: "true"

  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
