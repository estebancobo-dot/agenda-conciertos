name: Capturar HTML de una fuente (para desarrollar parsers)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Líneas 'nombre URL' separadas por ';' (p. ej. 'misala https://misala.es/agenda')"
        required: true

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Descargar (respetando robots.txt)
        run: |
          echo "${{ github.event.inputs.urls }}" | tr ';' '\n' > /tmp/urls.txt
          python tools/capturar.py /tmp/urls.txt capturas/
      - name: Guardar capturas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas
          git commit -m "Capturas HTML" || exit 0
          git pull --rebase --autostash
          git push
